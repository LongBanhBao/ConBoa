<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#03040e">
  <meta name="description" content="Một chuyến du hành tĩnh lặng giữa tinh hà và những chú cá voi vũ trụ.">
  <title>Kình Ca Giữa Ngân Hà</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;1,300&display=swap');
    :root { color-scheme: dark; --ink:#03040e; --glow:#99dbff; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--ink); }
    body { color:#edf4ff; font-family:"Be Vietnam Pro",sans-serif; }
    canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
    .vignette {
      position:fixed; inset:0; pointer-events:none; z-index:2;
      background:
        radial-gradient(circle at 50% 47%,transparent 28%,rgba(2,3,13,.18) 62%,rgba(1,2,9,.88) 100%),
        linear-gradient(180deg,rgba(6,9,28,.2),transparent 24%,transparent 72%,rgba(1,2,9,.46));
    }
    .grain {
      position:fixed; inset:-50%; z-index:3; pointer-events:none; opacity:.032;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");
      animation:grain .28s steps(2) infinite;
    }
    .brand { position:fixed; top:clamp(24px,5vw,58px); left:clamp(24px,6vw,78px); z-index:4; user-select:none; pointer-events:none; }
    .brand p { margin:0 0 10px; color:rgba(185,215,245,.62); font-size:9px; font-weight:500; letter-spacing:.42em; text-transform:uppercase; }
    .brand h1 { margin:0; font:italic 300 clamp(32px,5vw,66px)/.92 "Cormorant Garamond",serif; letter-spacing:-.035em; text-shadow:0 0 30px rgba(126,193,255,.15); }
    .brand h1 span { display:block; margin-left:clamp(20px,5vw,62px); color:var(--glow); }
    .quote { position:fixed; right:clamp(24px,6vw,80px); bottom:clamp(26px,6vw,64px); z-index:4; width:min(285px,58vw); margin:0; color:rgba(210,226,247,.55); font:300 clamp(11px,1.2vw,13px)/1.8 "Be Vietnam Pro",sans-serif; letter-spacing:.04em; text-align:right; pointer-events:none; }
    .hint { position:fixed; left:clamp(24px,6vw,78px); bottom:clamp(26px,6vw,64px); z-index:4; display:flex; align-items:center; gap:11px; color:rgba(180,208,236,.38); font-size:9px; letter-spacing:.2em; text-transform:uppercase; pointer-events:none; animation:breathe 4s ease-in-out infinite; }
    .hint::before { content:""; width:27px; height:1px; background:currentColor; }
    .lock-screen {
      position:fixed; inset:0; z-index:20; display:grid; place-items:center;
      overflow:hidden; background:
        radial-gradient(circle at 50% 18%,rgba(80,105,180,.2),transparent 30%),
        radial-gradient(circle at 20% 80%,rgba(54,108,140,.12),transparent 35%),
        linear-gradient(155deg,#090d20,#02040e 68%);
      transition:opacity .8s ease,visibility .8s ease,transform .8s cubic-bezier(.22,.8,.2,1);
    }
    .lock-screen::before {
      content:""; position:absolute; width:min(92vw,660px); aspect-ratio:1; border-radius:50%;
      background:radial-gradient(circle,rgba(122,203,255,.1),rgba(79,80,196,.035) 40%,transparent 68%);
      filter:blur(12px); animation:lockAura 8s ease-in-out infinite;
    }
    .lock-screen.unlocked { opacity:0; visibility:hidden; transform:scale(1.06); pointer-events:none; }
    .lock-panel { position:relative; width:min(100%,390px); padding:22px 32px 28px; text-align:center; user-select:none; }
    .lock-icon { width:25px; height:21px; margin:0 auto 24px; position:relative; border:2px solid rgba(231,244,255,.88); border-radius:5px; }
    .lock-icon::before { content:""; position:absolute; left:5px; top:-13px; width:11px; height:14px; border:2px solid rgba(231,244,255,.88); border-bottom:0; border-radius:9px 9px 0 0; }
    .lock-time { margin:0; font:300 clamp(58px,16vw,76px)/1 "Be Vietnam Pro",sans-serif; letter-spacing:-.06em; color:#f4f8ff; text-shadow:0 0 28px rgba(160,215,255,.16); }
    .lock-date { margin:8px 0 37px; color:rgba(221,235,252,.68); font-size:13px; letter-spacing:.04em; text-transform:capitalize; }
    .lock-title { margin:0 0 17px; color:rgba(238,246,255,.92); font-size:14px; font-weight:400; }
    .pass-dots { height:18px; display:flex; justify-content:center; align-items:center; gap:17px; margin-bottom:27px; }
    .pass-dot { width:10px; height:10px; border:1px solid rgba(230,242,255,.72); border-radius:50%; transition:background .14s ease,transform .14s ease; }
    .pass-dot.filled { background:#f2f8ff; transform:scale(1.08); }
    .pass-dots.error { animation:shake .38s ease; }
    .keypad { display:grid; grid-template-columns:repeat(3,68px); justify-content:center; gap:12px 21px; }
    .key {
      width:68px; height:68px; padding:0; border:1px solid rgba(210,230,255,.16); border-radius:50%;
      color:#f1f6ff; background:rgba(198,222,255,.09); backdrop-filter:blur(8px);
      cursor:pointer; font:300 27px/1 "Be Vietnam Pro",sans-serif;
      transition:background .15s ease,transform .12s ease,border-color .15s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .key small { display:block; margin-top:3px; font-size:7px; font-weight:500; letter-spacing:.18em; }
    .key:hover { background:rgba(207,230,255,.16); border-color:rgba(220,237,255,.3); }
    .key:active { transform:scale(.92); background:rgba(225,239,255,.26); }
    .key:focus-visible { outline:2px solid #a8ddff; outline-offset:3px; }
    .key.empty { visibility:hidden; }
    .key.delete { border-color:transparent; background:transparent; font-size:11px; letter-spacing:.04em; }
    .lock-message { height:17px; margin:15px 0 0; color:#ffadb9; font-size:11px; opacity:0; transition:opacity .2s ease; }
    .lock-message.show { opacity:1; }
    @keyframes grain { 0%{transform:translate(0)} 25%{transform:translate(2%,-3%)} 50%{transform:translate(-3%,2%)} 75%{transform:translate(3%,4%)} 100%{transform:translate(-2%,-3%)} }
    @keyframes breathe { 50%{opacity:.45;transform:translateX(5px)} }
    @keyframes shake { 20%,60%{transform:translateX(-9px)} 40%,80%{transform:translateX(9px)} }
    @keyframes lockAura { 50%{transform:scale(1.12);opacity:.72} }
    @media (max-width:620px) {
      .quote{display:none} .brand h1{font-size:39px} .hint{font-size:8px}
      .lock-panel{padding:18px 25px 22px} .lock-date{margin-bottom:28px}
      .keypad{grid-template-columns:repeat(3,64px);gap:10px 20px}.key{width:64px;height:64px}
    }
    @media (prefers-reduced-motion:reduce) { .grain,.hint{animation:none} }
  </style>
</head>
<body>
  <section class="lock-screen" id="lockScreen" aria-labelledby="lockTitle">
    <div class="lock-panel">
      <div class="lock-icon" aria-hidden="true"></div>
      <p class="lock-time" id="lockTime">00:00</p>
      <p class="lock-date" id="lockDate"></p>
      <h2 class="lock-title" id="lockTitle">Nhập mật mã để bước vào</h2>
      <div class="pass-dots" id="passDots" aria-label="Chưa nhập số nào">
        <span class="pass-dot"></span><span class="pass-dot"></span>
        <span class="pass-dot"></span><span class="pass-dot"></span>
      </div>
      <div class="keypad" id="keypad">
        <button class="key" type="button" data-number="1">1<small>&nbsp;</small></button>
        <button class="key" type="button" data-number="2">2<small>ABC</small></button>
        <button class="key" type="button" data-number="3">3<small>DEF</small></button>
        <button class="key" type="button" data-number="4">4<small>GHI</small></button>
        <button class="key" type="button" data-number="5">5<small>JKL</small></button>
        <button class="key" type="button" data-number="6">6<small>MNO</small></button>
        <button class="key" type="button" data-number="7">7<small>PQRS</small></button>
        <button class="key" type="button" data-number="8">8<small>TUV</small></button>
        <button class="key" type="button" data-number="9">9<small>WXYZ</small></button>
        <span class="key empty" aria-hidden="true"></span>
        <button class="key" type="button" data-number="0">0<small>&nbsp;</small></button>
        <button class="key delete" id="deleteKey" type="button">Xóa</button>
      </div>
      <p class="lock-message" id="lockMessage" role="status">Mật mã chưa đúng. Hãy thử lại.</p>
    </div>
  </section>
  <canvas id="universe" aria-label="Tinh hà chuyển động với hai chú cá voi đang bơi xung quanh"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
  <header class="brand">
    <p>Chuyến du hành vô tận</p>
    <h1>Kình ca <span>giữa ngân hà</span></h1>
  </header>
  <p class="hint">Di chuyển để đánh thức vũ trụ</p>
  <p class="quote">“Ở nơi sâu nhất của bóng tối,<br>mọi ánh sáng đều biết cách cất lời.”</p>
  <script>
    (() => {
      const lockScreen = document.querySelector('#lockScreen');
      const passDots = document.querySelector('#passDots');
      const dots = [...document.querySelectorAll('.pass-dot')];
      const lockMessage = document.querySelector('#lockMessage');
      const lockTime = document.querySelector('#lockTime');
      const lockDate = document.querySelector('#lockDate');
      let enteredCode = '';
      let checkingCode = false;
      let isUnlocked = false;

      function updateClock() {
        const now = new Date();
        lockTime.textContent = now.toLocaleTimeString('vi-VN', { hour:'2-digit', minute:'2-digit', hour12:false });
        lockDate.textContent = now.toLocaleDateString('vi-VN', { weekday:'long', day:'numeric', month:'long' });
      }

      function renderCode() {
        dots.forEach((dot,index) => dot.classList.toggle('filled',index < enteredCode.length));
        passDots.setAttribute('aria-label', `Đã nhập ${enteredCode.length} trên 4 số`);
      }

      function unlock() {
        isUnlocked = true;
        lockMessage.classList.remove('show');
        lockScreen.classList.add('unlocked');
        lockScreen.setAttribute('aria-hidden','true');
        setTimeout(() => lockScreen.remove(), 900);
      }

      function rejectCode() {
        lockMessage.classList.add('show');
        passDots.classList.remove('error');
        void passDots.offsetWidth;
        passDots.classList.add('error');
        setTimeout(() => {
          enteredCode = '';
          checkingCode = false;
          renderCode();
        }, 520);
      }

      function addNumber(number) {
        if (checkingCode || isUnlocked || enteredCode.length >= 4) return;
        lockMessage.classList.remove('show');
        enteredCode += number;
        renderCode();
        if (enteredCode.length === 4) {
          checkingCode = true;
          setTimeout(() => enteredCode === '0000' ? unlock() : rejectCode(), 170);
        }
      }

      document.querySelector('#keypad').addEventListener('click',event => {
        const key = event.target.closest('[data-number]');
        if (key) addNumber(key.dataset.number);
      });
      document.querySelector('#deleteKey').addEventListener('click',() => {
        if (checkingCode || isUnlocked) return;
        enteredCode = enteredCode.slice(0,-1);
        lockMessage.classList.remove('show');
        renderCode();
      });
      addEventListener('keydown',event => {
        if (isUnlocked) return;
        if (/^[0-9]$/.test(event.key)) addNumber(event.key);
        if (event.key === 'Backspace') {
          enteredCode = enteredCode.slice(0,-1);
          renderCode();
        }
      });
      updateClock();
      setInterval(updateClock,30000);

      const canvas = document.querySelector('#universe');
      const ctx = canvas.getContext('2d', { alpha:false });
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const TAU = Math.PI * 2;
      const pointer = { x:0, y:0, tx:0, ty:0 };
      const stars = [], dust = [], galaxy = [];
      let width=0, height=0, dpr=1, elapsed=0, lastTime=performance.now();
      const random = (min,max) => min + Math.random() * (max-min);

      function resize() {
        width=innerWidth; height=innerHeight; dpr=Math.min(devicePixelRatio||1,2);
        canvas.width=Math.round(width*dpr); canvas.height=Math.round(height*dpr);
        canvas.style.width=width+'px'; canvas.style.height=height+'px';
        ctx.setTransform(dpr,0,0,dpr,0,0); createScene();
      }

      function createScene() {
        stars.length=dust.length=galaxy.length=0;
        const starCount=Math.min(650,Math.floor(width*height/2400));
        for(let i=0;i<starCount;i++) stars.push({
          x:Math.random()*width,y:Math.random()*height,r:random(.18,1.25),
          a:random(.12,.78),twinkle:random(.4,1.8),phase:random(0,TAU),depth:random(.1,1)
        });
        for(let i=0;i<34;i++) dust.push({
          x:Math.random()*width,y:Math.random()*height,r:random(20,95),
          hue:Math.random()>.58?random(195,222):random(255,286),a:random(.007,.025),drift:random(.4,1.3)
        });
        const count=Math.min(1900,Math.max(850,Math.floor(width*height/650)));
        for(let i=0;i<count;i++) {
          const arm=i%4, radius=Math.pow(Math.random(),.64);
          galaxy.push({
            radius, angle:arm*TAU/4+radius*9.2+random(-.48,.48)*(radius+.12),
            size:random(.25,1.45)*(1.2-radius*.34), alpha:random(.16,.8)*(1.08-radius*.45),
            speed:random(.018,.045), hue:random(192,232)+(Math.random()>.78?70:0), z:random(-1,1)
          });
        }
      }

      function drawBackground(t) {
        const cx=width*.5+pointer.x*10, cy=height*.5+pointer.y*7;
        const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(width,height)*.76);
        bg.addColorStop(0,'#0b1230'); bg.addColorStop(.3,'#070a1d');
        bg.addColorStop(.68,'#030511'); bg.addColorStop(1,'#010208');
        ctx.fillStyle=bg; ctx.fillRect(0,0,width,height);
        for(const c of dust) {
          const x=c.x+Math.sin(t*.02*c.drift+c.x)*18+pointer.x*7*c.drift;
          const y=c.y+Math.cos(t*.016*c.drift+c.y)*12+pointer.y*5*c.drift;
          const g=ctx.createRadialGradient(x,y,0,x,y,c.r);
          g.addColorStop(0,`hsla(${c.hue},85%,64%,${c.a})`); g.addColorStop(1,'transparent');
          ctx.fillStyle=g; ctx.fillRect(x-c.r,y-c.r,c.r*2,c.r*2);
        }
        for(const s of stars) {
          const a=s.a*(.67+Math.sin(t*s.twinkle+s.phase)*.33);
          const x=(s.x+pointer.x*s.depth*8+width)%width;
          const y=(s.y+pointer.y*s.depth*6+height)%height;
          ctx.beginPath(); ctx.arc(x,y,s.r,0,TAU);
          ctx.fillStyle=`rgba(205,226,255,${a})`; ctx.fill();
        }
      }

      function drawGalaxy(t) {
        const cx=width*.5+pointer.x*13, cy=height*.5+pointer.y*9;
        const scale=Math.min(width,height)*(width<620?.37:.43);
        ctx.save(); ctx.translate(cx,cy); ctx.rotate(-.18+pointer.x*.025); ctx.scale(1,.42);
        ctx.globalCompositeOperation='screen';
        const halo=ctx.createRadialGradient(0,0,0,0,0,scale*.72);
        halo.addColorStop(0,'rgba(228,246,255,.34)'); halo.addColorStop(.08,'rgba(124,210,255,.2)');
        halo.addColorStop(.35,'rgba(90,111,255,.08)'); halo.addColorStop(1,'rgba(15,25,75,0)');
        ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(0,0,scale*.72,0,TAU); ctx.fill();
        for(const p of galaxy) {
          const a=p.angle+t*p.speed*(1.1-p.radius*.5), r=p.radius*scale;
          const x=Math.cos(a)*r, y=Math.sin(a)*r+Math.sin(a*3+p.z*5)*scale*.018*p.radius;
          ctx.beginPath(); ctx.arc(x,y,p.size,0,TAU);
          ctx.fillStyle=`hsla(${p.hue},92%,${70+p.z*7}%,${p.alpha})`; ctx.fill();
        }
        const core=ctx.createRadialGradient(0,0,0,0,0,scale*.16);
        core.addColorStop(0,'rgba(255,255,245,.98)'); core.addColorStop(.08,'rgba(191,236,255,.9)');
        core.addColorStop(.28,'rgba(92,190,255,.38)'); core.addColorStop(1,'rgba(87,77,255,0)');
        ctx.fillStyle=core; ctx.beginPath(); ctx.arc(0,0,scale*.16,0,TAU); ctx.fill();
        ctx.restore(); ctx.globalCompositeOperation='source-over';
      }

      function whalePose(t,c) {
        const short=Math.min(width,height);
        const rx=Math.min(width*c.orbitX,short*c.maxOrbit);
        const ry=Math.min(height*c.orbitY,short*c.maxOrbit*.54);
        const a=c.phase+t*c.speed;
        const x=width*.5+Math.cos(a)*rx+pointer.x*c.depth*16;
        const y=height*.51+Math.sin(a)*ry+Math.sin(t*.72+c.phase)*11+pointer.y*c.depth*11;
        const dx=-Math.sin(a)*rx*c.speed;
        const dy=Math.cos(a)*ry*c.speed+Math.cos(t*.72+c.phase)*7.92;
        return {x,y,angle:Math.atan2(dy,dx),wave:t*c.tailSpeed+c.phase,scale:c.scale*Math.min(1.08,Math.max(.67,short/720))};
      }

      function drawWhale(p,palette) {
        const {x,y,angle,wave,scale}=p;
        ctx.save(); ctx.translate(x,y); ctx.rotate(angle); ctx.scale(scale,scale);
        ctx.shadowColor=palette.glow; ctx.shadowBlur=24;
        const bend1=Math.sin(wave)*8, bend2=Math.sin(wave-.75)*15;

        ctx.beginPath(); ctx.moveTo(-62,-7); ctx.quadraticCurveTo(-83,bend1-8,-102,bend2-4);
        ctx.lineTo(-102,bend2+5); ctx.quadraticCurveTo(-83,bend1+10,-58,11); ctx.closePath();
        ctx.fillStyle=palette.bodyDark; ctx.fill();

        ctx.save(); ctx.translate(-101,bend2); ctx.rotate(Math.sin(wave-.75)*.18);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(-14,-4,-28,-18,-32,-31);
        ctx.bezierCurveTo(-13,-27,-2,-16,2,-3); ctx.bezierCurveTo(-1,10,-13,22,-27,27);
        ctx.bezierCurveTo(-22,10,-10,1,0,0); ctx.closePath(); ctx.fillStyle=palette.body; ctx.fill(); ctx.restore();

        const body=ctx.createLinearGradient(-65,-30,70,28);
        body.addColorStop(0,palette.bodyDark); body.addColorStop(.46,palette.body); body.addColorStop(1,palette.belly);
        ctx.beginPath(); ctx.moveTo(-65,-13); ctx.bezierCurveTo(-34,-34,21,-34,61,-14);
        ctx.bezierCurveTo(82,-3,78,17,58,25); ctx.bezierCurveTo(20,39,-37,29,-65,10);
        ctx.bezierCurveTo(-73,3,-73,-5,-65,-13); ctx.closePath(); ctx.fillStyle=body; ctx.fill();

        ctx.shadowBlur=0; ctx.strokeStyle=palette.line; ctx.lineWidth=1;
        for(let i=0;i<5;i++) { ctx.beginPath(); ctx.moveTo(23+i*7,20+i*.2); ctx.quadraticCurveTo(47+i*4,16,68,7+i*.7); ctx.stroke(); }

        ctx.globalAlpha=.62; ctx.beginPath(); ctx.moveTo(-5,20);
        ctx.bezierCurveTo(-16,39,-10,54,12,63); ctx.bezierCurveTo(18,45,16,29,10,20);
        ctx.fillStyle=palette.bodyDark; ctx.fill(); ctx.globalAlpha=1;

        ctx.save(); ctx.translate(18,21); ctx.rotate(.08+Math.sin(wave-.45)*.12);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(5,18,18,35,37,43);
        ctx.bezierCurveTo(43,24,30,7,12,-3); ctx.closePath(); ctx.fillStyle=palette.fin; ctx.fill(); ctx.restore();

        ctx.beginPath(); ctx.arc(57,-8,1.75,0,TAU); ctx.fillStyle='rgba(222,250,255,.95)';
        ctx.shadowColor='#b9edff'; ctx.shadowBlur=7; ctx.fill();
        for(let i=0;i<7;i++) {
          ctx.beginPath(); ctx.arc(-37+i*13,-15+Math.sin(i*1.7)*5,.75+(i%2)*.35,0,TAU);
          ctx.fillStyle=palette.spot; ctx.fill();
        }
        ctx.restore();
      }

      function drawWhales(t) {
        const a=whalePose(t,{phase:.15,speed:.105,tailSpeed:2.05,orbitX:.42,orbitY:.31,maxOrbit:.76,scale:1.08,depth:.7});
        const b=whalePose(t,{phase:Math.PI+.62,speed:-.082,tailSpeed:1.72,orbitX:.34,orbitY:.23,maxOrbit:.64,scale:.72,depth:1.15});
        const front={body:'#405a76',bodyDark:'#17283f',belly:'#7795aa',fin:'#2e4763',line:'rgba(203,234,244,.2)',glow:'rgba(102,205,255,.36)',spot:'rgba(178,238,255,.55)'};
        const back={body:'#52647c',bodyDark:'#202b42',belly:'#7892a6',fin:'#3d506a',line:'rgba(186,220,233,.16)',glow:'rgba(90,177,229,.28)',spot:'rgba(166,227,255,.42)'};
        const whales=[{pose:a,palette:front},{pose:b,palette:back}].sort((u,v)=>u.pose.y-v.pose.y);
        drawWhale(whales[0].pose,whales[0].palette); drawWhale(whales[1].pose,whales[1].palette);
      }

      function shootingStar(t) {
        const cycle=(t*.065)%1; if(cycle>.16)return;
        const progress=cycle/.16, x=width*(.78-progress*.27), y=height*(.12+progress*.18);
        const g=ctx.createLinearGradient(x,y,x+90,y-60);
        g.addColorStop(0,`rgba(206,237,255,${Math.sin(progress*Math.PI)*.7})`); g.addColorStop(1,'transparent');
        ctx.strokeStyle=g; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+90,y-60); ctx.stroke();
      }

      function frame(now) {
        const delta=Math.min((now-lastTime)/1000,.04); lastTime=now;
        elapsed+=reducedMotion?delta*.12:delta;
        pointer.x+=(pointer.tx-pointer.x)*.035; pointer.y+=(pointer.ty-pointer.y)*.035;
        drawBackground(elapsed); drawGalaxy(elapsed); drawWhales(elapsed); shootingStar(elapsed);
        requestAnimationFrame(frame);
      }
      addEventListener('pointermove',e=>{pointer.tx=e.clientX/width-.5;pointer.ty=e.clientY/height-.5},{passive:true});
      addEventListener('pointerleave',()=>{pointer.tx=0;pointer.ty=0});
      addEventListener('resize',resize,{passive:true});
      resize(); requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>

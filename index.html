<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#02030b">
  <meta name="description" content="Chuỗi chân dung huyền ảo giữa tinh hà cùng hai chú cá voi 3D.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%238edcff' d='M32 3l5.6 20.4L58 29l-20.4 5.6L32 55l-5.6-20.4L6 29l20.4-5.6z'/%3E%3C/svg%3E">
  <title>Whales Beyond the Stars</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&display=swap');
    :root { color-scheme:dark; --ink:#02030b; --ice:#eef7ff; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--ink); }
    body { color:var(--ice); font-family:"Be Vietnam Pro",sans-serif; }
    #scene { position:fixed; inset:0; width:100%; height:100%; display:block; opacity:0; touch-action:none; transition:opacity 1.2s ease; }
    #scene.ready { opacity:1; }
    .vignette {
      position:fixed; inset:0; z-index:2; pointer-events:none;
      background:
        radial-gradient(circle at 50% 50%,transparent 30%,rgba(2,3,13,.08) 57%,rgba(1,2,8,.67) 100%),
        linear-gradient(180deg,rgba(2,3,12,.22),transparent 30%,transparent 70%,rgba(1,2,8,.3));
    }
    .grain {
      position:fixed; inset:-40%; z-index:3; pointer-events:none; opacity:.025;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.75'/%3E%3C/svg%3E");
      animation:grain .35s steps(2) infinite;
    }
    .local-portrait-carousel {
      --aura-opacity:.52; --aura-scale:1; --spark-opacity:.2;
      position:fixed; left:50%; top:51%; z-index:1; width:min(36vw,390px); height:min(57vh,500px);
      transform:translate(-50%,-50%) scale(.975); opacity:0; visibility:hidden; pointer-events:none;
      isolation:isolate; transition:opacity 1s ease,visibility 1s ease,transform 1.35s cubic-bezier(.2,.75,.2,1);
    }
    .local-portrait-carousel.active { opacity:1; visibility:visible; transform:translate(-50%,-50%) scale(1); }
    .local-portrait-carousel::before,
    .local-portrait-carousel::after {
      content:""; position:absolute; inset:-13%; z-index:-1; border-radius:50%; pointer-events:none;
    }
    .local-portrait-carousel::before {
      background:radial-gradient(ellipse,rgba(110,202,255,.22),rgba(129,83,255,.1) 42%,transparent 72%);
      filter:blur(14px); opacity:var(--aura-opacity); transform:scale(var(--aura-scale));
    }
    .local-portrait-carousel::after {
      inset:-5%;
      background:
        radial-gradient(circle at 18% 27%,rgba(155,225,255,.75) 0 1px,transparent 2px),
        radial-gradient(circle at 79% 34%,rgba(192,166,255,.8) 0 1px,transparent 2px),
        radial-gradient(circle at 67% 76%,rgba(112,206,255,.68) 0 1px,transparent 2px),
        radial-gradient(circle at 28% 68%,rgba(218,203,255,.7) 0 1px,transparent 2px);
      background-size:71px 83px,89px 67px,77px 91px,97px 79px;
      filter:drop-shadow(0 0 5px #7dcfff); opacity:var(--spark-opacity);
    }
    .local-portrait {
      position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:center;
      opacity:0; transform:translateY(8px) scale(.985); will-change:opacity,transform,filter;
      -webkit-mask-image:radial-gradient(ellipse 66% 60% at 50% 49%,#000 43%,rgba(0,0,0,.88) 67%,transparent 100%);
      mask-image:radial-gradient(ellipse 66% 60% at 50% 49%,#000 43%,rgba(0,0,0,.88) 67%,transparent 100%);
      filter:brightness(.72) saturate(.92) contrast(1.04) drop-shadow(0 0 12px rgba(117,193,255,.36));
    }
    .scene-loader {
      position:fixed; inset:0; z-index:5; display:grid; place-items:center; pointer-events:none;
      color:rgba(211,225,255,.48); background:#02030b; font-size:10px; letter-spacing:.3em;
      text-transform:uppercase; transition:opacity .8s ease,visibility .8s ease;
    }
    .scene-loader.hidden { opacity:0; visibility:hidden; }
    .scene-loader::after {
      content:""; position:absolute; width:36px; height:36px; margin-top:-52px;
      border:1px solid rgba(154,121,255,.2); border-top-color:#b89cff; border-radius:50%;
      animation:spin 1.2s linear infinite;
    }
    .webgl-error {
      position:fixed; inset:0; z-index:6; display:none; place-items:center; padding:32px;
      color:#dfeaff; background:#03050e; text-align:center; line-height:1.8;
    }
    .camera-hint {
      position:fixed; left:50%; bottom:clamp(20px,4vw,38px); z-index:4;
      display:flex; align-items:center; gap:10px; transform:translateX(-50%);
      color:rgba(214,228,255,.5); font-size:9px; letter-spacing:.18em; text-transform:uppercase;
      white-space:nowrap; pointer-events:none; transition:opacity .8s ease,transform .8s ease;
    }
    .camera-hint::before {
      content:""; width:22px; height:22px; border:1px solid rgba(202,220,255,.36); border-radius:50%;
      box-shadow:inset 0 0 12px rgba(127,105,255,.15);
    }
    body.camera-used .camera-hint { opacity:0; transform:translate(-50%,8px); }
    .lock-screen {
      position:fixed; inset:0; z-index:20; display:grid; place-items:center; overflow:hidden;
      background:
        radial-gradient(circle at 50% 18%,rgba(80,105,180,.2),transparent 30%),
        radial-gradient(circle at 20% 80%,rgba(54,108,140,.12),transparent 35%),
        linear-gradient(155deg,#090d20,#02040e 68%);
      transition:opacity .8s ease,visibility .8s ease,transform .8s cubic-bezier(.22,.8,.2,1);
    }
    .lock-screen::before {
      content:""; position:absolute; width:min(92vw,660px); aspect-ratio:1; border-radius:50%;
      background:radial-gradient(circle,rgba(122,203,255,.1),rgba(79,80,196,.035) 40%,transparent 68%);
      filter:blur(12px); animation:lockAura 8s ease-in-out infinite;
    }
    .lock-screen.unlocked { opacity:0; visibility:hidden; transform:scale(1.06); pointer-events:none; }
    .lock-panel { position:relative; width:min(100%,390px); padding:22px 32px 28px; text-align:center; user-select:none; }
    .lock-icon { width:25px; height:21px; margin:0 auto 24px; position:relative; border:2px solid rgba(231,244,255,.88); border-radius:5px; }
    .lock-icon::before { content:""; position:absolute; left:5px; top:-13px; width:11px; height:14px; border:2px solid rgba(231,244,255,.88); border-bottom:0; border-radius:9px 9px 0 0; }
    .lock-time { margin:0; font:300 clamp(58px,16vw,76px)/1 "Be Vietnam Pro",sans-serif; letter-spacing:-.06em; color:#f4f8ff; text-shadow:0 0 28px rgba(160,215,255,.16); }
    .lock-date { margin:8px 0 37px; color:rgba(221,235,252,.68); font-size:13px; letter-spacing:.04em; text-transform:capitalize; }
    .lock-title { margin:0 0 17px; color:rgba(238,246,255,.92); font-size:14px; font-weight:400; }
    .pass-dots { height:18px; display:flex; justify-content:center; align-items:center; gap:17px; margin-bottom:27px; }
    .pass-dot { width:10px; height:10px; border:1px solid rgba(230,242,255,.72); border-radius:50%; transition:background .14s ease,transform .14s ease; }
    .pass-dot.filled { background:#f2f8ff; transform:scale(1.08); }
    .pass-dots.error { animation:shake .38s ease; }
    .keypad { display:grid; grid-template-columns:repeat(3,68px); justify-content:center; gap:12px 21px; }
    .key {
      width:68px; height:68px; padding:0; border:1px solid rgba(210,230,255,.16); border-radius:50%;
      color:#f1f6ff; background:rgba(198,222,255,.09); backdrop-filter:blur(8px);
      cursor:pointer; font:300 27px/1 "Be Vietnam Pro",sans-serif;
      transition:background .15s ease,transform .12s ease,border-color .15s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .key small { display:block; margin-top:3px; font-size:7px; font-weight:500; letter-spacing:.18em; }
    .key:hover { background:rgba(207,230,255,.16); border-color:rgba(220,237,255,.3); }
    .key:active { transform:scale(.92); background:rgba(225,239,255,.26); }
    .key:focus-visible { outline:2px solid #a8ddff; outline-offset:3px; }
    .key.empty { visibility:hidden; }
    .key.delete { border-color:transparent; background:transparent; font-size:11px; letter-spacing:.04em; }
    .lock-message { height:17px; margin:15px 0 0; color:#ffadb9; font-size:11px; opacity:0; visibility:hidden; transition:opacity .2s ease,visibility .2s ease; }
    .lock-message.show { opacity:1; visibility:visible; }
    @keyframes spin { to{transform:rotate(360deg)} }
    @keyframes grain { 0%{transform:translate(0)} 25%{transform:translate(2%,-3%)} 50%{transform:translate(-3%,2%)} 75%{transform:translate(3%,4%)} 100%{transform:translate(-2%,-3%)} }
    @keyframes shake { 20%,60%{transform:translateX(-9px)} 40%,80%{transform:translateX(9px)} }
    @keyframes lockAura { 50%{transform:scale(1.12);opacity:.72} }
    @media (max-width:620px) {
      .lock-panel{padding:18px 25px 22px}.lock-date{margin-bottom:28px}
      .keypad{grid-template-columns:repeat(3,64px);gap:10px 20px}.key{width:64px;height:64px}
      .local-portrait-carousel{top:50%;width:min(72vw,310px);height:min(47vh,400px)}
    }
    @media (max-height:620px) {
      .lock-screen{place-items:start center;overflow-y:auto;scrollbar-width:none}
      .lock-screen::-webkit-scrollbar{display:none}
      .lock-panel{padding:10px 24px 12px}.lock-icon{display:none}.lock-time{font-size:36px}
      .lock-date{margin:4px 0 10px;font-size:11px}.lock-title{margin-bottom:8px}
      .pass-dots{margin-bottom:10px}.keypad{grid-template-columns:repeat(3,48px);gap:5px 18px}
      .key{width:48px;height:48px;font-size:20px}.lock-message{margin-top:7px}
      .local-portrait-carousel{width:min(45vw,300px);height:min(70vh,360px)}
    }
    @media (prefers-reduced-motion:reduce) {
      .grain,.lock-screen::before,.scene-loader::after{animation:none}
      .local-portrait-carousel{transition:opacity .25s ease,visibility .25s ease}
    }
  </style>

    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",

<body>
  <section class="lock-screen" id="lockScreen" aria-labelledby="lockTitle">
    <div class="lock-panel">
      <div class="lock-icon" aria-hidden="true"></div>
      <p class="lock-time" id="lockTime">00:00</p>
      <p class="lock-date" id="lockDate"></p>
      <h2 class="lock-title" id="lockTitle">Nhập mật mã để bước vào</h2>
      <div class="pass-dots" id="passDots" aria-label="Chưa nhập số nào">
        <span class="pass-dot"></span><span class="pass-dot"></span>
        <span class="pass-dot"></span><span class="pass-dot"></span>
      </div>
      <div class="keypad" id="keypad">
        <button class="key" type="button" data-number="1">1<small>&nbsp;</small></button>
        <button class="key" type="button" data-number="2">2<small>ABC</small></button>
        <button class="key" type="button" data-number="3">3<small>DEF</small></button>
        <button class="key" type="button" data-number="4">4<small>GHI</small></button>
        <button class="key" type="button" data-number="5">5<small>JKL</small></button>
        <button class="key" type="button" data-number="6">6<small>MNO</small></button>
        <button class="key" type="button" data-number="7">7<small>PQRS</small></button>
        <button class="key" type="button" data-number="8">8<small>TUV</small></button>
        <button class="key" type="button" data-number="9">9<small>WXYZ</small></button>
        <span class="key empty" aria-hidden="true"></span>
        <button class="key" type="button" data-number="0">0<small>&nbsp;</small></button>
        <button class="key delete" id="deleteKey" type="button">Xóa</button>
      </div>
      <p class="lock-message" id="lockMessage" role="status">Mật mã chưa đúng. Hãy thử lại.</p>
    </div>
  </section>
  <canvas id="scene" aria-label="Chuỗi chân dung huyền ảo giữa tinh hà cùng hai chú cá voi 3D"></canvas>
  <div class="local-portrait-carousel" id="localPortraitCarousel" aria-hidden="true">
    <img class="local-portrait" alt="">
    <img class="local-portrait" alt="">
  </div>
  <div class="scene-loader" id="sceneLoader">Đang kiến tạo vũ trụ 3D</div>
  <div class="webgl-error" id="webglError">Thiết bị của bạn chưa hỗ trợ WebGL 2.<br>Hãy thử mở trang bằng trình duyệt mới hơn.</div>
  <div class="camera-hint">Kéo để xoay · Chạm để đổi góc nhìn</div>
  <div class="vignette"></div>
  <div class="grain"></div>

  <script>
    (() => {
      const screen=document.querySelector('#lockScreen');
      const dots=[...document.querySelectorAll('.pass-dot')];
      const dotRow=document.querySelector('#passDots');
      const message=document.querySelector('#lockMessage');
      const clockTime=document.querySelector('#lockTime');
      const clockDate=document.querySelector('#lockDate');
      let code='',checking=false,unlocked=false,clockTimer;
      const updateClock=()=>{
        const now=new Date();
        clockTime.textContent=now.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',hour12:false});
        clockDate.textContent=now.toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long'});
      };
      const renderCode=()=>{
        dots.forEach((dot,index)=>dot.classList.toggle('filled',index<code.length));
        dotRow.setAttribute('aria-label','Đã nhập '+code.length+' trên 4 số');
      };
      const unlock=()=>{
        unlocked=true;clearInterval(clockTimer);message.classList.remove('show');screen.classList.add('unlocked');
        if(document.activeElement instanceof HTMLElement)document.activeElement.blur();
        screen.setAttribute('aria-hidden','true');setTimeout(()=>screen.remove(),900);
      };
      const reject=()=>{
        message.classList.add('show');dotRow.classList.remove('error');void dotRow.offsetWidth;
        dotRow.classList.add('error');setTimeout(()=>{code='';checking=false;renderCode()},520);
      };
      const addNumber=number=>{
        if(checking||unlocked||code.length>=4)return;
        message.classList.remove('show');code+=number;renderCode();
        if(code.length===4){checking=true;setTimeout(()=>code==='0000'?unlock():reject(),170)}
      };
      document.querySelector('#keypad').addEventListener('click',event=>{
        const key=event.target.closest('[data-number]');if(key)addNumber(key.dataset.number);
      });
      document.querySelector('#deleteKey').addEventListener('click',()=>{
        if(checking||unlocked)return;code=code.slice(0,-1);message.classList.remove('show');renderCode();
      });
      addEventListener('keydown',event=>{
        if(unlocked||event.repeat)return;
        if(/^[0-9]$/.test(event.key))addNumber(event.key);
        if(event.key==='Backspace'&&!checking){code=code.slice(0,-1);renderCode()}
      });
      updateClock();clockTimer=setInterval(updateClock,30000);
    })();
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas=document.querySelector('#scene');
    const loader=document.querySelector('#sceneLoader');
    const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const localFileMode=location.protocol==='file:';
    if(!document.createElement('canvas').getContext('webgl2')){
      document.querySelector('#webglError').style.display='grid';
      loader.classList.add('hidden');
      throw new Error('WebGL 2 is not available');
    }

    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=.84;
    renderer.setClearColor(0x010208,1);
    const scene=new THREE.Scene();
    scene.background=new THREE.Color(0x010208);
    scene.fog=new THREE.FogExp2(0x02030d,.018);
    const camera=new THREE.PerspectiveCamera(49,1,.1,160);
    const world=new THREE.Group();
    scene.add(world);
    scene.add(new THREE.AmbientLight(0x34406f,.5));
    const coreLight=new THREE.PointLight(0xffc6f2,32,30,1.8);
    coreLight.position.set(0,.4,0);world.add(coreLight);
    const blueLight=new THREE.DirectionalLight(0x6ebcff,1.65);
    blueLight.position.set(-8,10,13);scene.add(blueLight);
    const violetLight=new THREE.DirectionalLight(0xb463ff,1.25);
    violetLight.position.set(9,-4,-10);scene.add(violetLight);

    const composer=new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene,camera));
    const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.72,.46,.34);
    composer.addPass(bloom);composer.addPass(new OutputPass());
    const controls=new OrbitControls(camera,canvas);
    controls.enableDamping=true;
    controls.dampingFactor=.055;
    controls.enablePan=false;
    controls.rotateSpeed=.52;
    controls.zoomSpeed=.72;
    controls.minPolarAngle=.24;
    controls.maxPolarAngle=Math.PI-.36;
    controls.target.set(0,0,0);
    let cameraInitialized=false;
    let cameraTransition=null;
    let viewIndex=0;

    function softTexture(stops){
      const size=256,c=document.createElement('canvas'),cctx=c.getContext('2d');
      c.width=c.height=size;
      const gradient=cctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
      stops.forEach(entry=>gradient.addColorStop(entry[0],entry[1]));
      cctx.fillStyle=gradient;cctx.fillRect(0,0,size,size);
      const texture=new THREE.CanvasTexture(c);texture.colorSpace=THREE.SRGBColorSpace;return texture;
    }

    function createCosmicWhaleTexture(){
      const c=document.createElement('canvas'),cctx=c.getContext('2d');
      c.width=1024;c.height=512;
      let seed=9173;
      const random=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
      const base=cctx.createLinearGradient(0,0,c.width,c.height);
      base.addColorStop(0,'#020b2f');base.addColorStop(.18,'#071e63');
      base.addColorStop(.38,'#0a3fa8');base.addColorStop(.56,'#1689e8');
      base.addColorStop(.73,'#155ee0');base.addColorStop(1,'#063b86');
      cctx.fillStyle=base;cctx.fillRect(0,0,c.width,c.height);
      cctx.globalCompositeOperation='screen';
      const cloudPalette=['76,112,255','25,140,255','35,218,255','46,95,255'];
      for(let i=0;i<26;i++){
        const x=random()*c.width,y=random()*c.height,r=35+random()*75;
        const hue=cloudPalette[Math.floor(random()*cloudPalette.length)];
        const cloud=cctx.createRadialGradient(x,y,0,x,y,r);
        cloud.addColorStop(0,'rgba('+hue+','+(0.1+random()*.16)+')');
        cloud.addColorStop(.45,'rgba('+hue+',.055)');cloud.addColorStop(1,'rgba('+hue+',0)');
        cctx.fillStyle=cloud;cctx.fillRect(x-r,y-r,r*2,r*2);
      }
      const nebula=cctx.createLinearGradient(80,430,940,75);
      nebula.addColorStop(0,'rgba(30,78,255,0)');
      nebula.addColorStop(.3,'rgba(42,105,255,.27)');
      nebula.addColorStop(.52,'rgba(96,190,255,.34)');
      nebula.addColorStop(.68,'rgba(43,225,255,.3)');
      nebula.addColorStop(1,'rgba(19,88,255,0)');
      cctx.lineCap='round';
      [[28,40,438,295,338,665,218,986,72],[18,-30,315,260,430,700,205,1055,332],
        [12,70,188,320,88,670,372,1000,250],[9,10,390,300,280,720,430,1030,135],
        [7,120,74,390,245,650,110,960,205]].forEach((curve,index)=>{
        cctx.strokeStyle=index%2?nebula:'rgba(92,205,255,.22)';cctx.lineWidth=curve[0];
        cctx.beginPath();cctx.moveTo(curve[1],curve[2]);
        cctx.bezierCurveTo(curve[3],curve[4],curve[5],curve[6],curve[7],curve[8]);cctx.stroke();
      });
      for(let i=0;i<1400;i++){
        const x=random()*c.width,y=random()*c.height,r=.25+random()*.9;
        cctx.fillStyle=random()>.76?'rgba(104,220,255,.92)':'rgba(224,245,255,.9)';
        cctx.beginPath();cctx.arc(x,y,r,0,Math.PI*2);cctx.fill();
      }
      for(let i=0;i<82;i++){
        const x=random()*c.width,y=random()*c.height,r=1.15+random()*.9;
        cctx.fillStyle=random()>.68?'rgba(92,220,255,.94)':'rgba(218,242,255,.94)';
        cctx.beginPath();cctx.arc(x,y,r,0,Math.PI*2);cctx.fill();
      }
      for(let i=0;i<15;i++){
        const x=random()*c.width,y=random()*c.height,r=1.35+random()*1.45;
        cctx.strokeStyle='rgba(235,244,255,'+(0.55+random()*.38)+')';cctx.lineWidth=.8;
        cctx.beginPath();cctx.moveTo(x-r*4,y);cctx.lineTo(x+r*4,y);cctx.moveTo(x,y-r*4);cctx.lineTo(x,y+r*4);cctx.stroke();
        cctx.fillStyle='#ffffff';cctx.beginPath();cctx.arc(x,y,r,0,Math.PI*2);cctx.fill();
      }
      cctx.globalCompositeOperation='source-over';
      const texture=new THREE.CanvasTexture(c);
      texture.colorSpace=THREE.SRGBColorSpace;
      texture.wrapS=THREE.RepeatWrapping;
      texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
      return {color:texture};
    }

    const cosmicWhaleTextures=createCosmicWhaleTexture();

    function addWhaleColorFlow(material,flowUniforms,strength){
      material.onBeforeCompile=shader=>{
        shader.uniforms.uCosmicTime=flowUniforms.uCosmicTime;
        shader.uniforms.uCosmicPhase=flowUniforms.uCosmicPhase;
        shader.uniforms.uFlowStrength={value:strength};
        shader.vertexShader=shader.vertexShader
          .replace('#include <common>','#include <common>\nvarying vec2 vCosmicUv;')
          .replace('#include <uv_vertex>','#include <uv_vertex>\nvCosmicUv=uv;');
        shader.fragmentShader=shader.fragmentShader
          .replace('#include <common>',`#include <common>
            varying vec2 vCosmicUv;
            uniform float uCosmicTime;
            uniform float uCosmicPhase;
            uniform float uFlowStrength;`)
          .replace('#include <map_fragment>',`#include <map_fragment>
            const float COSMIC_TAU=6.28318530718;
            float cosmicTravel=uCosmicTime*.03;
            float cosmicAround=sin(COSMIC_TAU*vCosmicUv.y);
            float cosmicAcross=cos(COSMIC_TAU*vCosmicUv.y);
            float cosmicWarp=.13*sin(COSMIC_TAU*(vCosmicUv.x*.41+uCosmicTime*.009)+cosmicAround*.7);
            float cosmicCoord=vCosmicUv.x*1.24+cosmicAround*.055+cosmicAcross*.025+cosmicWarp-cosmicTravel+uCosmicPhase;
            float cosmicA=.5+.5*sin(COSMIC_TAU*cosmicCoord);
            float cosmicB=.5+.5*sin(COSMIC_TAU*(vCosmicUv.x*.59+cosmicAcross*.07-uCosmicTime*.014+uCosmicPhase*.61)+1.72);
            float cosmicCenter=1.0-abs(cosmicA*2.0-1.0);
            float cosmicRidge=cosmicCenter*cosmicCenter;
            cosmicRidge*=cosmicRidge*cosmicCenter;
            vec3 cosmicNavy=vec3(.015,.07,.42);
            vec3 cosmicCobalt=vec3(.025,.2,.92);
            vec3 cosmicAzure=vec3(.025,.48,1.0);
            vec3 cosmicCyan=vec3(.01,.78,1.0);
            vec3 cosmicFlow=mix(cosmicNavy,cosmicCobalt,smoothstep(.08,.72,cosmicA));
            cosmicFlow=mix(cosmicFlow,cosmicAzure,smoothstep(.5,.94,cosmicB)*.82);
            cosmicFlow=mix(cosmicFlow,cosmicCyan,cosmicRidge*.46);
            float cosmicMask=.13+.23*smoothstep(.16,.88,cosmicA)+.18*smoothstep(.32,.95,cosmicB);
            vec3 cosmicColoredBase=diffuseColor.rgb*.76+cosmicFlow*.34;
            diffuseColor.rgb=mix(diffuseColor.rgb,cosmicColoredBase,cosmicMask*uFlowStrength);`)
          .replace('#include <emissivemap_fragment>',`#include <emissivemap_fragment>
            float cosmicGlow=(cosmicRidge*.065+pow(cosmicB,7.0)*.045)*uFlowStrength;
            totalEmissiveRadiance+=cosmicFlow*cosmicGlow;`);
        material.userData.shader=shader;
      };
      material.customProgramCacheKey=()=> 'whale-cosmic-flow-v1';
      material.needsUpdate=true;
    }

    function createLocalPortraitCarousel(urls){
      const container=document.querySelector('#localPortraitCarousel');
      if(!localFileMode||!container)return {update(){},dispose(){}};
      const slots=[...container.querySelectorAll('.local-portrait')];
      const requestedSources=urls.map(url=>new URL(url,document.baseURI).href);
      let sources=[],startedAt=null,disposed=false,ready=false,lastIndex=-1,lastBlend=-1;
      const slotIndexes=[-1,-1];
      const localImages=[];
      const frameCenter=new THREE.Vector3(),frameTop=new THREE.Vector3(),frameBottom=new THREE.Vector3();
      function loadLocalSource(source){
        return new Promise(resolve=>{
          const image=new Image();localImages.push(image);image.decoding='async';
          let settled=false;
          const finish=value=>{
            if(settled)return;settled=true;clearTimeout(timeoutId);
            image.onload=null;image.onerror=null;resolve(value);
          };
          const timeoutId=setTimeout(()=>finish(null),7000);
          image.onload=()=>finish(source);image.onerror=()=>finish(null);image.src=source;
        });
      }
      const sourceTasks=requestedSources.map(loadLocalSource);
      sourceTasks[0]?.then(firstSource=>{
        if(disposed||!firstSource||ready)return;
        sources=[firstSource];ready=true;
      });
      Promise.all(sourceTasks).then(loadedSources=>{
        if(disposed)return;
        const availableSources=loadedSources.filter(Boolean);
        if(!availableSources.length){
          console.error('Could not load any local portrait images.');
          return;
        }
        const hadStarted=startedAt!==null;
        sources=availableSources;ready=true;slotIndexes.fill(-1);lastIndex=-1;lastBlend=-1;
        if(hadStarted)startedAt=null;
      });
      function bind(slotIndex,portraitIndex){
        if(slotIndexes[slotIndex]===portraitIndex)return;
        slots[slotIndex].src=sources[portraitIndex];
        slotIndexes[slotIndex]=portraitIndex;
      }
      function styleSlot(slot,visibility,incoming,minimalMotion){
        const eased=THREE.MathUtils.clamp(visibility,0,1);
        slot.style.opacity=eased.toFixed(4);
        const offset=minimalMotion?0:(1-eased)*(incoming?10:-7);
        const scale=minimalMotion?1:.982+eased*.018;
        const blur=minimalMotion?0:(1-eased)*2.4;
        slot.style.transform=`translateY(${offset.toFixed(2)}px) scale(${scale.toFixed(4)})`;
        slot.style.filter=`brightness(.72) saturate(.92) contrast(1.04) blur(${blur.toFixed(2)}px) drop-shadow(0 0 12px rgba(117,193,255,.36))`;
      }
      function syncFrame(activeCamera){
        const responsiveScale=innerWidth<620?DEFAULT_CHARACTER_SETTINGS.mobileScale:1;
        const centerY=DEFAULT_CHARACTER_SETTINGS.y+DEFAULT_CHARACTER_SETTINGS.height*.5*responsiveScale;
        const topY=DEFAULT_CHARACTER_SETTINGS.y+DEFAULT_CHARACTER_SETTINGS.height*responsiveScale;
        frameCenter.set(DEFAULT_CHARACTER_SETTINGS.x,centerY,DEFAULT_CHARACTER_SETTINGS.z);
        frameTop.set(DEFAULT_CHARACTER_SETTINGS.x,topY,DEFAULT_CHARACTER_SETTINGS.z);
        frameBottom.set(DEFAULT_CHARACTER_SETTINGS.x,DEFAULT_CHARACTER_SETTINGS.y,DEFAULT_CHARACTER_SETTINGS.z);
        world.localToWorld(frameCenter);world.localToWorld(frameTop);world.localToWorld(frameBottom);
        frameCenter.project(activeCamera);frameTop.project(activeCamera);frameBottom.project(activeCamera);
        const projectedHeight=Math.abs(frameTop.y-frameBottom.y)*innerHeight*.5;
        if(!Number.isFinite(projectedHeight)||projectedHeight<24)return;
        const height=THREE.MathUtils.clamp(projectedHeight,105,innerHeight*.82);
        container.style.left=`${((frameCenter.x*.5+.5)*innerWidth).toFixed(2)}px`;
        container.style.top=`${((-frameCenter.y*.5+.5)*innerHeight).toFixed(2)}px`;
        container.style.width=`${(height*DEFAULT_CHARACTER_SETTINGS.frameAspect).toFixed(2)}px`;
        container.style.height=`${height.toFixed(2)}px`;
      }
      function update(realTime,prefersReducedMotion,activeCamera){
        if(disposed)return;
        syncFrame(activeCamera);
        if(!ready||!sources.length)return;
        const lockScreen=document.querySelector('#lockScreen');
        if(startedAt===null&&(!lockScreen||lockScreen.classList.contains('unlocked'))){
          startedAt=realTime;container.classList.add('active');
        }
        if(startedAt===null)return;
        const slideDuration=Math.max(.5,DEFAULT_CHARACTER_SETTINGS.slideDuration);
        const transitionDuration=Math.min(
          slideDuration*.45,
          prefersReducedMotion?Math.min(.75,DEFAULT_CHARACTER_SETTINGS.transitionDuration):DEFAULT_CHARACTER_SETTINGS.transitionDuration
        );
        const carouselTime=Math.max(0,realTime-startedAt);
        const currentIndex=Math.floor(carouselTime/slideDuration)%sources.length;
        const nextIndex=(currentIndex+1)%sources.length;
        const withinSlide=carouselTime%slideDuration;
        const transitionStart=slideDuration-transitionDuration;
        const linearBlend=sources.length>1
          ?THREE.MathUtils.clamp((withinSlide-transitionStart)/transitionDuration,0,1)
          :0;
        const blend=linearBlend*linearBlend*(3-2*linearBlend);
        if(currentIndex!==lastIndex||Math.abs(blend-lastBlend)>.0005){
          bind(0,currentIndex);bind(1,nextIndex);
          styleSlot(slots[0],1-blend,false,prefersReducedMotion);
          styleSlot(slots[1],blend,true,prefersReducedMotion);
          const transitionEnergy=Math.sin(Math.PI*linearBlend);
          container.style.setProperty('--aura-opacity',(.52+transitionEnergy*.28).toFixed(4));
          container.style.setProperty('--aura-scale',(1+transitionEnergy*(prefersReducedMotion?0:.05)).toFixed(4));
          container.style.setProperty('--spark-opacity',(.2+transitionEnergy*.58).toFixed(4));
          lastIndex=currentIndex;lastBlend=blend;
        }
      }
      function dispose(){
        if(disposed)return;disposed=true;container.remove();
        localImages.forEach(image=>{image.onload=null;image.onerror=null});
      }
      return {update,dispose};
    }

    const characterVertexShader=`
      precision highp float;
      varying vec2 vUv;
      uniform float uTime;
      uniform float uMotionScale;

      void main(){
        vUv=uv;
        vec3 p=position;
        float outer=smoothstep(.2,.49,abs(uv.x-.5));
        float hem=1.0-smoothstep(.14,.37,uv.y);
        float centerGuard=1.0-smoothstep(.1,.3,abs(uv.x-.5));
        float swayMask=outer*.76+hem*(1.0-centerGuard)*.24;
        p.x+=sin(uTime*.45+uv.y*8.0)*uMotionScale*swayMask;
        p.z+=sin(uTime*.31+uv.y*5.4)*uMotionScale*swayMask*.42;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
      }
    `;

    const characterFragmentShader=`
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D uMap;
      uniform vec3 uGlowColor;
      uniform float uGlowStrength;
      uniform float uOpacity;
      uniform float uTime;
      uniform float uReveal;
      uniform float uVisibility;
      uniform float uTextureAspect;
      uniform float uFrameAspect;
      uniform float uEffectsScale;
      uniform float uDissolveDirection;

      float hash21(vec2 p){
        p=fract(p*vec2(123.34,456.21));
        p+=dot(p,p+45.32);
        return fract(p.x*p.y);
      }

      void main(){
        float portraitWidth=clamp(uTextureAspect/uFrameAspect,.01,1.0);
        float portraitLeft=.5-portraitWidth*.5;
        vec2 portraitUv=vec2((vUv.x-portraitLeft)/portraitWidth,vUv.y);
        if(portraitUv.x<0.0||portraitUv.x>1.0)discard;

        vec4 source=texture2D(uMap,portraitUv);
        vec2 centered=(portraitUv-.5)*2.0;
        float superEllipse=pow(abs(centered.x),4.0)+pow(abs(centered.y),4.0);
        float portraitMask=1.0-smoothstep(.22,1.0,superEllipse);
        portraitMask*=smoothstep(0.0,.15,portraitUv.y);

        vec2 noiseCell=floor(portraitUv*vec2(103.0,151.0));
        float grain=hash21(noiseCell);
        float wave=.045*sin(portraitUv.y*10.5+portraitUv.x*4.2+uTime*.46*uEffectsScale);
        float rawDissolveField=clamp(portraitUv.y*.77+portraitUv.x*.05+grain*.13+wave,.0,1.0);
        float dissolveField=mix(rawDissolveField,1.0-rawDissolveField,uDissolveDirection);
        float visibility=clamp(uVisibility,0.0,1.0);
        float dissolve=smoothstep(dissolveField-.105,dissolveField+.105,visibility);
        dissolve*=smoothstep(0.0,.035,visibility);
        dissolve=mix(dissolve,1.0,smoothstep(.93,1.0,visibility));
        float transitionEnergy=4.0*visibility*(1.0-visibility);
        float frontier=exp(-pow((dissolveField-visibility)*15.0,2.0))*transitionEnergy;
        float sparkle=step(.982,hash21(noiseCell+19.7))*frontier;

        vec3 color=source.rgb;
        float luminance=dot(color,vec3(.2126,.7152,.0722));
        float aurora=.5+.5*sin(uTime*.34+portraitUv.y*7.5+portraitUv.x*4.7);
        vec3 cosmic=mix(vec3(.10,.58,1.0),vec3(.48,.25,1.0),aurora);
        float softEdge=1.0-smoothstep(.18,.78,portraitMask);
        vec3 celestialEdge=vec3(luminance)*vec3(.34,.54,.88)+cosmic*.065;
        color=mix(color,celestialEdge,softEdge*.62*uEffectsScale);
        color*=mix(.31,.265,smoothstep(.42,.94,luminance));
        float rim=smoothstep(.02,.22,portraitMask)*(1.0-smoothstep(.3,.76,portraitMask));
        color+=uGlowColor*rim*(.035+.025*sin(uTime*.72))*uGlowStrength;
        color+=cosmic*(frontier*.19+sparkle*.6)*uEffectsScale;
        float finalAlpha=portraitMask*uOpacity*uReveal*(dissolve+frontier*.075);
        if(finalAlpha<.008)discard;
        gl_FragColor=vec4(color,finalAlpha);
      }
    `;

    const characterParticleVertexShader=`
      precision highp float;
      attribute float aSize;
      attribute float aSeed;
      attribute float aAlpha;
      varying vec3 vColor;
      varying float vAlpha;
      uniform float uTime;
      uniform float uPixelRatio;
      uniform float uMotionScale;
      uniform float uReveal;

      void main(){
        vColor=color;
        float animatedTwinkle=.68+.32*sin(uTime*(.46+aSeed*.22)+aSeed*31.0);
        float twinkle=mix(.9,animatedTwinkle,uMotionScale);
        vAlpha=aAlpha*twinkle*uReveal;
        vec3 p=position;
        p.x+=sin(uTime*(.19+aSeed*.06)+aSeed*18.0)*(.018+aSeed*.025)*uMotionScale;
        p.y+=sin(uTime*(.14+aSeed*.05)+aSeed*26.0)*(.016+aSeed*.022)*uMotionScale;
        p.z+=cos(uTime*.13+aSeed*21.0)*.018*uMotionScale;
        vec4 mvPosition=modelViewMatrix*vec4(p,1.0);
        gl_PointSize=aSize*uPixelRatio*(58.0/max(5.0,-mvPosition.z));
        gl_Position=projectionMatrix*mvPosition;
      }
    `;

    `;

    function createMeditatingCharacter(options={}){
      const config={...DEFAULT_CHARACTER_SETTINGS,...options};
      const frameWidth=config.height*config.frameAspect;

      function update(time,realTime,delta,activeCamera,prefersReducedMotion){

            ?THREE.MathUtils.clamp((withinSlide-transitionStart)/transitionDuration,0,1)

    function createWhaleGeometry(){
      const sides=44;
      const profile=[
        [-4.5,.08,.06,.06,.07],[-4.42,.08,.11,.1,.13],[-4.1,.06,.21,.19,.26],
        [-3.65,.03,.34,.31,.4],[-3.1,.01,.46,.4,.52],[-2.45,0,.66,.55,.75],
        [-1.55,0,.84,.69,.99],[-.55,.02,.95,.77,1.16],[.45,.05,1,.84,1.24],
        [1.35,.07,.95,.88,1.25],[1.95,.075,.87,.84,1.23],[2.5,.08,.77,.79,1.19],
        [3,.085,.67,.72,1.13],[3.4,.095,.58,.64,1.05],[3.78,.105,.49,.56,.96],
        [4.1,.12,.41,.48,.84],[4.36,.14,.32,.38,.69],[4.56,.155,.22,.27,.51],
        [4.7,.16,.12,.15,.31],[4.77,.16,.035,.045,.075]
      ];
      const sample=(x,column)=>{
        if(x<=profile[0][0])return profile[0][column];
        for(let i=1;i<profile.length;i++)if(x<=profile[i][0]){
          const previous=profile[i-1],next=profile[i];
          const raw=THREE.MathUtils.clamp((x-previous[0])/(next[0]-previous[0]),0,1);
          const t=raw*raw*(3-2*raw);
          return THREE.MathUtils.lerp(previous[column],next[column],t);
        }
        return profile[profile.length-1][column];
      };

        if(x>=boneXs[0]){indices.push(0,0,0,0);weights.push(1,0,0,0);return}
        const last=boneXs.length-1;
        if(x<=boneXs[last]){indices.push(last,last,0,0);weights.push(1,0,0,0);return}
        for(let i=0;i<last;i++)if(x<=boneXs[i]&&x>=boneXs[i+1]){
          const mix=(boneXs[i]-x)/(boneXs[i]-boneXs[i+1]);
          indices.push(i,i+1,0,0);weights.push(1-mix,mix,0,0);return;
        }

      const pointAt=(x,angle,outward=1)=>{
        const cosine=Math.cos(angle),sine=Math.sin(angle);
        const exponent=THREE.MathUtils.lerp(1,.88,THREE.MathUtils.smoothstep(x,2.35,4.58));
        const yAxis=cosine>=0?sample(x,2):sample(x,3);

      const ringXs=[tailX];
      for(let i=1;i<profile.length;i++){
        const start=profile[i-1][0],end=profile[i][0];
        const divisions=Math.max(1,Math.ceil((end-start)/(end>2.7?.07:.105)));
        for(let step=1;step<=divisions;step++)ringXs.push(THREE.MathUtils.lerp(start,end,step/divisions));
      }

      positions.push(headX+.025,sample(headX,1),0);uvs.push(1,.5);addSkin(headX,skinIndices,skinWeights);
      const lastRingStart=(ringXs.length-1)*(sides+1);

      const geometry=new THREE.BufferGeometry();
      geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
      geometry.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
      geometry.setAttribute('skinIndex',new THREE.Uint16BufferAttribute(skinIndices,4));
      geometry.setAttribute('skinWeight',new THREE.Float32BufferAttribute(skinWeights,4));

          const patchV=j/bellySides;
          const angle=Math.PI+(patchV-.5)*opening*Math.PI*2;
          const jawVolume=THREE.MathUtils.smoothstep(x,2.15,4.55);
          const point=pointAt(x,angle,1.012+jawVolume*.014);
          bellyPositions.push(...point);bellyUvs.push(u,patchV);addSkin(x,bellySkinIndices,bellySkinWeights);
        }
      }
      for(let i=0;i<bellyRings;i++)for(let j=0;j<bellySides;j++){
        const a=i*(bellySides+1)+j,b=a+bellySides+1;
        bellyIndices.push(a,a+1,b,b,a+1,b+1);
      }
      const bellyGeometry=new THREE.BufferGeometry();
      bellyGeometry.setAttribute('position',new THREE.Float32BufferAttribute(bellyPositions,3));
      bellyGeometry.setAttribute('uv',new THREE.Float32BufferAttribute(bellyUvs,2));
      bellyGeometry.setAttribute('skinIndex',new THREE.Uint16BufferAttribute(bellySkinIndices,4));
      bellyGeometry.setAttribute('skinWeight',new THREE.Float32BufferAttribute(bellySkinWeights,4));
      bellyGeometry.setIndex(bellyIndices);bellyGeometry.computeVertexNormals();
      return {geometry,bellyGeometry,boneXs,boneYs,sample,pointAt,headX};
    }

    const WHALE_SCALE_MULTIPLIER=1.25;
    const WHALE_SPEED_MULTIPLIER=1.25;

    function createWhale(config){
      const motion={...DEFAULT_WHALE_MOTION,...(config.motion||{})};
      const scale=config.scale*WHALE_SCALE_MULTIPLIER,offset=config.offset;
      const speed=(config.speed??motion.pathSpeed)*WHALE_SPEED_MULTIPLIER,pathScale=config.pathScale;
      const root=new THREE.Group();
      root.scale.setScalar(scale);
      const result=createWhaleGeometry();
      const {geometry,bellyGeometry,boneXs,boneYs,sample,pointAt}=result;
      const waveLength=boneXs[0]-boneXs[boneXs.length-1];
      const waveProfile=boneXs.map(x=>{
        const s=(boneXs[0]-x)/waveLength;
        const u=THREE.MathUtils.clamp((s-motion.bendStart)/(1-motion.bendStart),0,1);
        const bodyEnvelope=Math.pow(u*u*(3-2*u),motion.bodyStiffness);
        const tailEnvelope=THREE.MathUtils.smoothstep(s,.72,1);
        return {s,amplitude:bodyEnvelope*motion.bodyAmplitude+tailEnvelope*tailEnvelope*motion.tailBoost};
      });
      const flowUniforms={
        uCosmicTime:{value:0},
        uCosmicPhase:{value:config.hueOffset??0}
      };
      const bodyMaterial=new THREE.MeshPhysicalMaterial({
        color:0xffffff,map:cosmicWhaleTextures.color,roughness:.22,metalness:.025,clearcoat:.42,clearcoatRoughness:.22,
        emissive:0xffffff,emissiveMap:cosmicWhaleTextures.color,emissiveIntensity:.23,
        iridescence:.08,iridescenceIOR:1.32,specularColor:0x62c8ff,specularIntensity:.5
      });
      addWhaleColorFlow(bodyMaterial,flowUniforms,.92);
      const bones=boneXs.map(()=>new THREE.Bone());
      bones[0].position.set(boneXs[0],boneYs[0],0);
      for(let i=1;i<bones.length;i++){
        bones[i].position.set(boneXs[i]-boneXs[i-1],boneYs[i]-boneYs[i-1],0);
        bones[i-1].add(bones[i]);
      }
      const skeleton=new THREE.Skeleton(bones);
      const body=new THREE.SkinnedMesh(geometry,bodyMaterial);
      body.add(bones[0]);body.bind(skeleton);body.normalizeSkinWeights();body.frustumCulled=false;root.add(body);
      const bellyMaterial=new THREE.MeshPhysicalMaterial({
        color:0xcfeaff,roughness:.36,metalness:0,clearcoat:.18,clearcoatRoughness:.42,
        emissive:0x244e78,emissiveIntensity:.18,specularColor:0x90d8ff,specularIntensity:.35,
        polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1
      });
      const bellyMesh=new THREE.SkinnedMesh(bellyGeometry,bellyMaterial);
      bellyMesh.bind(skeleton,body.bindMatrix);bellyMesh.normalizeSkinWeights();bellyMesh.frustumCulled=false;root.add(bellyMesh);
      const localSurfacePoint=(x,angle,outward,boneIndex)=>{
        const point=pointAt(x,angle,outward);
        return new THREE.Vector3(point[0]-boneXs[boneIndex],point[1]-boneYs[boneIndex],point[2]);
      };
      const eyeMaterial=new THREE.MeshPhysicalMaterial({color:0x010107,roughness:.08,clearcoat:1});
      const eyeSocketMaterial=new THREE.MeshPhysicalMaterial({
        color:0x061936,roughness:.32,clearcoat:.3,emissive:0x0c3f82,emissiveIntensity:.18,
        specularColor:0x5ec8ff,specularIntensity:.4
      });
      const eyeGlowMaterial=new THREE.MeshBasicMaterial({color:0xaee9ff});
      const eyeFoldMaterial=new THREE.MeshPhysicalMaterial({
        color:0x071b3f,roughness:.48,emissive:0x0b4e94,emissiveIntensity:.12,transparent:true,opacity:.72
      });
      const mouthMaterial=new THREE.MeshBasicMaterial({color:0x020b1f});
      const lipMaterial=new THREE.MeshBasicMaterial({color:0x55aee8,transparent:true,opacity:.36});
      [-1,1].forEach(side=>{
        const sideAngle=delta=>side*(Math.PI*.5+delta);
        const eyeX=1.88;
        const eyeSocket=new THREE.Mesh(new THREE.SphereGeometry(.112,22,14),eyeSocketMaterial);
        eyeSocket.scale.set(1.4,.62,.32);eyeSocket.rotation.z=side*.065;
        eyeSocket.position.copy(localSurfacePoint(eyeX,sideAngle(0),1.007,1));eyeSocket.position.y+=.03;bones[1].add(eyeSocket);
        const eye=new THREE.Mesh(new THREE.SphereGeometry(.058,20,14),eyeMaterial);
        eye.scale.set(1.28,.52,.38);eye.rotation.z=side*.065;
        eye.position.copy(localSurfacePoint(eyeX,sideAngle(0),1.03,1));eye.position.y+=.035;bones[1].add(eye);
        const eyeGlow=new THREE.Mesh(new THREE.SphereGeometry(.015,10,8),eyeGlowMaterial);
        eyeGlow.position.set(.028,.023,side*.054);eye.add(eyeGlow);
        [
          {delta:-.065,radius:.011,opacity:1,xs:[1.58,1.72,1.93,2.15,2.28]},
          {delta:.07,radius:.008,opacity:.76,xs:[1.6,1.76,1.96,2.14,2.24]},
          {delta:.15,radius:.007,opacity:.36,xs:[1.52,1.7,1.94,2.18]}
        ].forEach(fold=>{
          const points=fold.xs.map(x=>localSurfacePoint(x,sideAngle(fold.delta),1.014,1));
          const material=eyeFoldMaterial.clone();material.opacity*=fold.opacity;
          bones[1].add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points),22,fold.radius,6,false),material));
        });
        const mouthXs=[1.58,2.12,2.72,3.28,3.8,4.22,4.55,4.7];
        const mouthPoints=mouthXs.map((x,index)=>{
          const t=index/(mouthXs.length-1);
          return localSurfacePoint(x,sideAngle(THREE.MathUtils.lerp(.24,.065,t)),1.014,0);
        });
        const mouthCurve=new THREE.CatmullRomCurve3(mouthPoints);
        bones[0].add(new THREE.Mesh(new THREE.TubeGeometry(mouthCurve,34,.014,7,false),mouthMaterial));
        const lipPoints=mouthPoints.slice(3).map(point=>new THREE.Vector3(point.x,point.y+.027,point.z+side*.007));
        bones[0].add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(lipPoints),22,.005,6,false),lipMaterial));
        const jawXs=[1.55,1.78,2.04,2.32,2.6];
        const jawPoints=jawXs.map(x=>localSurfacePoint(x,sideAngle(.38),1.016,0));
        bones[0].add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(jawPoints),18,.008,5,false),eyeFoldMaterial));
      });
      const bumpMaterial=new THREE.MeshPhysicalMaterial({
        color:0x2869b8,roughness:.56,clearcoat:.1,emissive:0x0c3568,emissiveIntensity:.05,
        specularColor:0x62c8ff,specularIntensity:.35
      });
      const tubercles=[
        [2.08,0],[2.45,0],[2.84,0],[3.24,0],[3.62,0],[3.98,0],[4.3,0],[4.53,0],
        [2.34,.24],[2.34,-.24],[2.74,.34],[2.74,-.34],[3.14,.42],[3.14,-.42],
        [3.55,.37],[3.55,-.37],[3.94,.29],[3.94,-.29],[4.28,.18],[4.28,-.18]
      ];
      const bumpGeometry=new THREE.SphereGeometry(1,10,8);
      const bumpInstances=new THREE.InstancedMesh(bumpGeometry,bumpMaterial,tubercles.length);
      const bumpTransform=new THREE.Object3D();
      tubercles.forEach((entry,index)=>{
        const radius=.026+(index%5)*.0018;
        bumpTransform.position.copy(localSurfacePoint(entry[0],entry[1],1.01,0));
        bumpTransform.scale.set(radius,radius*.64,radius);bumpTransform.updateMatrix();
        bumpInstances.setMatrixAt(index,bumpTransform.matrix);
      });
      bumpInstances.instanceMatrix.needsUpdate=true;bumpInstances.computeBoundingSphere();bones[0].add(bumpInstances);
      const blowholeMaterial=new THREE.MeshPhysicalMaterial({color:0x010817,roughness:.18,clearcoat:.7});
      const blowholeBase=localSurfacePoint(2.34,0,1.008,0);
      [-.085,.085].forEach(z=>{
        const blowhole=new THREE.Mesh(new THREE.SphereGeometry(.055,12,8),blowholeMaterial);
        blowhole.scale.set(1.35,.2,.56);blowhole.position.copy(blowholeBase);blowhole.position.z=z;bones[0].add(blowhole);
      });
      const finMaterial=new THREE.MeshPhysicalMaterial({
        color:0xffffff,map:cosmicWhaleTextures.color,emissive:0xffffff,emissiveMap:cosmicWhaleTextures.color,
        emissiveIntensity:.25,roughness:.2,clearcoat:.38,clearcoatRoughness:.22,
        iridescence:.1,iridescenceIOR:1.32,specularColor:0x62c8ff,specularIntensity:.48
      });
      addWhaleColorFlow(finMaterial,flowUniforms,.78);
      const pectoralGeometry=createAppendageGeometry(false),flukeGeometry=createAppendageGeometry(true);
      const fins=[];
      [-1,1].forEach(side=>{
        const pivot=new THREE.Group();pivot.position.set(-.12,-.25,side*1.15);pivot.userData.side=side;
        const fin=new THREE.Mesh(pectoralGeometry,finMaterial);fin.scale.set(1.12,1.08,side*.9);pivot.add(fin);
        bones[1].add(pivot);fins.push(pivot);
      });
      const flukeRoot=new THREE.Group();
      flukeRoot.position.set(-.14,.02,0);bones[bones.length-1].add(flukeRoot);
      [-1,1].forEach(side=>{
        const lobePivot=new THREE.Group();lobePivot.rotation.x=side*.035;
        const fluke=new THREE.Mesh(flukeGeometry,finMaterial);fluke.scale.z=side;lobePivot.add(fluke);
        flukeRoot.add(lobePivot);
      });
      const dorsal=new THREE.Mesh(createDorsalGeometry(),finMaterial);
      dorsal.position.set(.35,.84,0);bones[4].add(dorsal);

      const grooveMaterial=new THREE.MeshBasicMaterial({color:0x405b79,transparent:true,opacity:.48});
      [-.8,-.6,-.4,-.2,0,.2,.4,.6,.8].forEach(lane=>{
        const grooveXs=[1.65,2.12,2.72,3.28,3.76,4.14,4.42];
        const groovePoints=grooveXs.map(x=>{
          const convergence=THREE.MathUtils.smoothstep(x,2.05,4.48);
          const opening=THREE.MathUtils.lerp(.68,.12,convergence);
          return localSurfacePoint(x,Math.PI+lane*opening,1.024,0);
        });
        const grooveCurve=new THREE.CatmullRomCurve3(groovePoints);
        bones[0].add(new THREE.Mesh(new THREE.TubeGeometry(grooveCurve,28,.008,5,false),grooveMaterial));
      });
      world.add(root);return {
        root,bones,fins,flukeRoot,bellyMesh,bellyMaterial,bodyMaterial,finMaterial,flowUniforms,
        waveProfile,motion,offset,speed,pathScale,swimOffset:offset*Math.PI*2
      };
    }

    const pathPoints=[];
    for(let i=0;i<12;i++){
      const angle=i/12*Math.PI*2;
      const height=-Math.sin(angle+.4)*.9+Math.sin(angle*3-.2)*.22;
      pathPoints.push(new THREE.Vector3(Math.cos(angle)*9.2,height,Math.sin(angle)*7.7));
    }
    const swimPath=new THREE.CatmullRomCurve3(pathPoints,true,'centripetal',.45);
    const whales=[
      createWhale({scale:.72,offset:.22,hueOffset:0,pathScale:1}),
      createWhale({scale:.49,offset:.72,hueOffset:.06,pathScale:1})
    ];
    const axisX=new THREE.Vector3(1,0,0),axisZ=new THREE.Vector3(0,0,1);
    const tangent=new THREE.Vector3(),tangentAhead=new THREE.Vector3(),position=new THREE.Vector3();
    const worldUp=new THREE.Vector3(0,1,0),pathUp=new THREE.Vector3(),pathSide=new THREE.Vector3();
    const turnCross=new THREE.Vector3();
    const orientationMatrix=new THREE.Matrix4();
    const targetQuaternion=new THREE.Quaternion(),rollQuaternion=new THREE.Quaternion(),pitchQuaternion=new THREE.Quaternion();

    function whaleWave(phase){
      return Math.sin(phase)+.035*Math.sin(phase*2+.4)+.008*Math.sin(phase*3-.35);
    }

    function animateWhale(whale,time,delta){
      const cycle=(time*whale.speed+whale.offset)%1;
      const motion=whale.motion;
      const swimRate=Math.PI*2*motion.tailBeatFrequency*WHALE_SPEED_MULTIPLIER;
      const stroke=time*swimRate+whale.swimOffset;
      whale.flowUniforms.uCosmicTime.value=time*WHALE_SPEED_MULTIPLIER;
      const colorPhase=time*.19*WHALE_SPEED_MULTIPLIER+whale.flowUniforms.uCosmicPhase.value*Math.PI*2;
      const spectralPulse=.5+.5*Math.sin(colorPhase);
      whale.bodyMaterial.emissive.setHSL(.61+.045*Math.sin(colorPhase*.73),.34,.72);
      whale.bodyMaterial.emissiveIntensity=.21+spectralPulse*.06;
      whale.finMaterial.emissive.setHSL(.59+.05*Math.sin(colorPhase*.81+.7),.38,.7);
      whale.finMaterial.emissiveIntensity=.23+(1-spectralPulse)*.06;
      whale.bellyMaterial.emissive.setHSL(.6+.03*Math.sin(colorPhase*.42),.34,.24);
      whale.bellyMaterial.emissiveIntensity=.15+spectralPulse*.03;
      swimPath.getPointAt(cycle,position);swimPath.getTangentAt(cycle,tangent).normalize();
      swimPath.getTangentAt((cycle+.004)%1,tangentAhead).normalize();
      whale.root.position.copy(position).multiplyScalar(whale.pathScale);
      pathSide.crossVectors(tangent,worldUp);
      if(pathSide.lengthSq()<.000001)pathSide.set(0,0,1);else pathSide.normalize();
      pathUp.crossVectors(pathSide,tangent).normalize();
      orientationMatrix.makeBasis(tangent,pathUp,pathSide);
      targetQuaternion.setFromRotationMatrix(orientationMatrix);
      turnCross.crossVectors(tangent,tangentAhead);
      const curvatureBank=THREE.MathUtils.clamp(worldUp.dot(turnCross)*9,-.24,.24);
      const livingRoll=Math.sin(time*.36*WHALE_SPEED_MULTIPLIER+whale.swimOffset)*.025;
      const livingPitch=whaleWave(stroke-.85)*motion.pitchAmplitude;
      rollQuaternion.setFromAxisAngle(axisX,curvatureBank+livingRoll);
      pitchQuaternion.setFromAxisAngle(axisZ,livingPitch);
      targetQuaternion.multiply(rollQuaternion).multiply(pitchQuaternion);
      whale.root.quaternion.slerp(targetQuaternion,1-Math.exp(-motion.orientationResponse*delta));
      let previousTangent=0;
      whale.bones.forEach((bone,index)=>{
        const profile=whale.waveProfile[index];
        const phase=stroke-profile.s*motion.phaseDelay;
        const desiredTangent=whaleWave(phase)*profile.amplitude;
        bone.rotation.z=desiredTangent-previousTangent;
        bone.rotation.x=0;bone.rotation.y=0;
        previousTangent=desiredTangent;
      });
      whale.fins.forEach(fin=>{
        const side=fin.userData.side;
        const finPhase=stroke*motion.pectoralRate-.65;
        fin.rotation.x=side*(.24+motion.pectoralAmplitude*Math.sin(finPhase))-curvatureBank*motion.finSteering;
        fin.rotation.y=.075+motion.pectoralTiltAmplitude*Math.sin(stroke*.22+1.1);
        fin.rotation.z=-side*(.03+motion.pectoralTiltAmplitude*.75*Math.sin(finPhase+.55));
      });
      const tailPhase=stroke-motion.phaseDelay-motion.flukeLag;
      whale.flukeRoot.rotation.z=-motion.tailAmplitude*whaleWave(tailPhase);
      const heave=(Math.sin(stroke-.72)*motion.heaveAmplitude+Math.sin(stroke*2+.1)*motion.heaveHarmonic)*whale.root.scale.x;
      whale.root.position.addScaledVector(pathUp,heave);
    }

    createStarfield();
    const galaxy=createGalaxy();
    const meditatingCharacter=createMeditatingCharacter();
    const localPortraitCarousel=createLocalPortraitCarousel(DEFAULT_CHARACTER_SETTINGS.portraitUrls);
    const dustTexture=softTexture([[0,'rgba(148,106,255,.32)'],[.35,'rgba(68,73,220,.12)'],[1,'rgba(20,16,80,0)']]);
    for(let i=0;i<13;i++){
      const cloud=new THREE.Sprite(new THREE.SpriteMaterial({map:dustTexture,color:i%2?0x875dff:0x387fcf,transparent:true,opacity:THREE.MathUtils.randFloat(.045,.105),blending:THREE.AdditiveBlending,depthWrite:false}));
      const angle=Math.random()*Math.PI*2,r=THREE.MathUtils.randFloat(3.5,10);
      cloud.position.set(Math.cos(angle)*r,THREE.MathUtils.randFloatSpread(3),Math.sin(angle)*r);
      const size=THREE.MathUtils.randFloat(4,8);cloud.scale.set(size,size,1);world.add(cloud);
    }

    const timer=new THREE.Timer();
    timer.connect(document);
    function cameraViews(){
      if(innerWidth<620)return [
        new THREE.Vector3(0,4.3,20.5),
        new THREE.Vector3(8.8,6.4,16.2),
        new THREE.Vector3(-8.2,3.2,17.4),
        new THREE.Vector3(0,12.5,14.2)
      ];
      return [
        new THREE.Vector3(0,5.1,21.5),
        new THREE.Vector3(15.2,7.1,13.1),
        new THREE.Vector3(-13.6,3.4,15.3),
        new THREE.Vector3(0,15.2,11.8)
      ];
    }
    function cycleCameraView(){
      const views=cameraViews();
      viewIndex=(viewIndex+1)%views.length;
      cameraTransition={position:views[viewIndex],target:new THREE.Vector3(0,0,0)};
    }
    function resize(){
      const w=innerWidth,h=innerHeight,aspect=w/h,mobile=w<620;
      const pixelRatio=Math.min(devicePixelRatio||1,mobile?1.2:1.45);
      renderer.setPixelRatio(pixelRatio);renderer.setSize(w,h,false);
      composer.setPixelRatio(pixelRatio);composer.setSize(w,h);
      camera.aspect=aspect;camera.fov=mobile?56:49;
      if(!cameraInitialized){
        camera.position.copy(cameraViews()[0]);
        cameraInitialized=true;
      }
      world.scale.setScalar(mobile?.72:1);camera.updateProjectionMatrix();
      controls.minDistance=mobile?10:11;
      controls.maxDistance=mobile?31:38;
      bloom.strength=mobile?.56:.72;galaxy.userData.uniforms.uPixelRatio.value=pixelRatio;
      meditatingCharacter.setResponsive(mobile,pixelRatio);
    }
    function render(timestamp){
      timer.update(timestamp);
      const delta=Math.min(timer.getDelta(),.05);
      const realTime=timer.getElapsed();
      const time=realTime*(reducedMotion?.16:1);
      galaxy.rotation.y=time*.028;galaxy.rotation.x=Math.sin(time*.045)*.025;
      galaxy.userData.uniforms.uTime.value=time;whales.forEach(whale=>animateWhale(whale,time,delta));
      if(cameraTransition){
        camera.position.lerp(cameraTransition.position,1-Math.exp(-2.76*delta));
        controls.target.lerp(cameraTransition.target,1-Math.exp(-3.4*delta));
        if(camera.position.distanceTo(cameraTransition.position)<.035)cameraTransition=null;
      }
      controls.update();
      meditatingCharacter.update(time,realTime,delta,camera,reducedMotion);
      localPortraitCarousel.update(realTime,reducedMotion,camera);
      composer.render();requestAnimationFrame(render);
    }
    let gestureStart=null;
    canvas.addEventListener('pointerdown',event=>{
      if(!event.isPrimary){gestureStart=null;return}
      cameraTransition=null;
      gestureStart={x:event.clientX,y:event.clientY,time:performance.now()};
      document.body.classList.add('camera-used');
    },{passive:true});
    canvas.addEventListener('pointerup',event=>{
      if(!event.isPrimary){gestureStart=null;return}
      if(!gestureStart)return;
      const distance=Math.hypot(event.clientX-gestureStart.x,event.clientY-gestureStart.y);
      const duration=performance.now()-gestureStart.time;
      if(distance<8&&duration<480)cycleCameraView();
      gestureStart=null;
    },{passive:true});
    canvas.addEventListener('pointercancel',()=>{gestureStart=null},{passive:true});
    controls.addEventListener('start',()=>{cameraTransition=null});
    addEventListener('resize',resize,{passive:true});
    addEventListener('beforeunload',()=>{
      meditatingCharacter.dispose();localPortraitCarousel.dispose();
    },{once:true});
    resize();canvas.classList.add('ready');loader.classList.add('hidden');requestAnimationFrame(render);
  </script>
</body>

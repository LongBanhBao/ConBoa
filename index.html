<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#02030b">
  <meta name="description" content="Một nhân vật thiền định giữa tinh hà huyền ảo cùng hai chú cá voi 3D.">
  <title>Whales Beyond the Stars</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&display=swap');
    :root { color-scheme:dark; --ink:#02030b; --ice:#eef7ff; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--ink); }
    body { color:var(--ice); font-family:"Be Vietnam Pro",sans-serif; }
    #scene { position:fixed; inset:0; width:100%; height:100%; display:block; opacity:0; touch-action:none; transition:opacity 1.2s ease; }
    #scene.ready { opacity:1; }
    .vignette {
      position:fixed; inset:0; z-index:2; pointer-events:none;
      background:
        radial-gradient(circle at 50% 50%,transparent 30%,rgba(2,3,13,.08) 57%,rgba(1,2,8,.67) 100%),
        linear-gradient(180deg,rgba(2,3,12,.22),transparent 30%,transparent 70%,rgba(1,2,8,.3));
    }
    .grain {
      position:fixed; inset:-40%; z-index:3; pointer-events:none; opacity:.025;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.75'/%3E%3C/svg%3E");
      animation:grain .35s steps(2) infinite;
    }
    .scene-loader {
      position:fixed; inset:0; z-index:5; display:grid; place-items:center; pointer-events:none;
      color:rgba(211,225,255,.48); background:#02030b; font-size:10px; letter-spacing:.3em;
      text-transform:uppercase; transition:opacity .8s ease,visibility .8s ease;
    }
    .scene-loader.hidden { opacity:0; visibility:hidden; }
    .scene-loader::after {
      content:""; position:absolute; width:36px; height:36px; margin-top:-52px;
      border:1px solid rgba(154,121,255,.2); border-top-color:#b89cff; border-radius:50%;
      animation:spin 1.2s linear infinite;
    }
    .webgl-error {
      position:fixed; inset:0; z-index:6; display:none; place-items:center; padding:32px;
      color:#dfeaff; background:#03050e; text-align:center; line-height:1.8;
    }
    .camera-hint {
      position:fixed; left:50%; bottom:clamp(20px,4vw,38px); z-index:4;
      display:flex; align-items:center; gap:10px; transform:translateX(-50%);
      color:rgba(214,228,255,.5); font-size:9px; letter-spacing:.18em; text-transform:uppercase;
      white-space:nowrap; pointer-events:none; transition:opacity .8s ease,transform .8s ease;
    }
    .camera-hint::before {
      content:""; width:22px; height:22px; border:1px solid rgba(202,220,255,.36); border-radius:50%;
      box-shadow:inset 0 0 12px rgba(127,105,255,.15);
    }
    body.camera-used .camera-hint { opacity:0; transform:translate(-50%,8px); }
    .lock-screen {
      position:fixed; inset:0; z-index:20; display:grid; place-items:center; overflow:hidden;
      background:
        radial-gradient(circle at 50% 18%,rgba(80,105,180,.2),transparent 30%),
        radial-gradient(circle at 20% 80%,rgba(54,108,140,.12),transparent 35%),
        linear-gradient(155deg,#090d20,#02040e 68%);
      transition:opacity .8s ease,visibility .8s ease,transform .8s cubic-bezier(.22,.8,.2,1);
    }
    .lock-screen::before {
      content:""; position:absolute; width:min(92vw,660px); aspect-ratio:1; border-radius:50%;
      background:radial-gradient(circle,rgba(122,203,255,.1),rgba(79,80,196,.035) 40%,transparent 68%);
      filter:blur(12px); animation:lockAura 8s ease-in-out infinite;
    }
    .lock-screen.unlocked { opacity:0; visibility:hidden; transform:scale(1.06); pointer-events:none; }
    .lock-panel { position:relative; width:min(100%,390px); padding:22px 32px 28px; text-align:center; user-select:none; }
    .lock-icon { width:25px; height:21px; margin:0 auto 24px; position:relative; border:2px solid rgba(231,244,255,.88); border-radius:5px; }
    .lock-icon::before { content:""; position:absolute; left:5px; top:-13px; width:11px; height:14px; border:2px solid rgba(231,244,255,.88); border-bottom:0; border-radius:9px 9px 0 0; }
    .lock-time { margin:0; font:300 clamp(58px,16vw,76px)/1 "Be Vietnam Pro",sans-serif; letter-spacing:-.06em; color:#f4f8ff; text-shadow:0 0 28px rgba(160,215,255,.16); }
    .lock-date { margin:8px 0 37px; color:rgba(221,235,252,.68); font-size:13px; letter-spacing:.04em; text-transform:capitalize; }
    .lock-title { margin:0 0 17px; color:rgba(238,246,255,.92); font-size:14px; font-weight:400; }
    .pass-dots { height:18px; display:flex; justify-content:center; align-items:center; gap:17px; margin-bottom:27px; }
    .pass-dot { width:10px; height:10px; border:1px solid rgba(230,242,255,.72); border-radius:50%; transition:background .14s ease,transform .14s ease; }
    .pass-dot.filled { background:#f2f8ff; transform:scale(1.08); }
    .pass-dots.error { animation:shake .38s ease; }
    .keypad { display:grid; grid-template-columns:repeat(3,68px); justify-content:center; gap:12px 21px; }
    .key {
      width:68px; height:68px; padding:0; border:1px solid rgba(210,230,255,.16); border-radius:50%;
      color:#f1f6ff; background:rgba(198,222,255,.09); backdrop-filter:blur(8px);
      cursor:pointer; font:300 27px/1 "Be Vietnam Pro",sans-serif;
      transition:background .15s ease,transform .12s ease,border-color .15s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .key small { display:block; margin-top:3px; font-size:7px; font-weight:500; letter-spacing:.18em; }
    .key:hover { background:rgba(207,230,255,.16); border-color:rgba(220,237,255,.3); }
    .key:active { transform:scale(.92); background:rgba(225,239,255,.26); }
    .key:focus-visible { outline:2px solid #a8ddff; outline-offset:3px; }
    .key.empty { visibility:hidden; }
    .key.delete { border-color:transparent; background:transparent; font-size:11px; letter-spacing:.04em; }
    .lock-message { height:17px; margin:15px 0 0; color:#ffadb9; font-size:11px; opacity:0; visibility:hidden; transition:opacity .2s ease,visibility .2s ease; }
    .lock-message.show { opacity:1; visibility:visible; }
    @keyframes spin { to{transform:rotate(360deg)} }
    @keyframes grain { 0%{transform:translate(0)} 25%{transform:translate(2%,-3%)} 50%{transform:translate(-3%,2%)} 75%{transform:translate(3%,4%)} 100%{transform:translate(-2%,-3%)} }
    @keyframes shake { 20%,60%{transform:translateX(-9px)} 40%,80%{transform:translateX(9px)} }
    @keyframes lockAura { 50%{transform:scale(1.12);opacity:.72} }
    @media (max-width:620px) {
      .lock-panel{padding:18px 25px 22px}.lock-date{margin-bottom:28px}
      .keypad{grid-template-columns:repeat(3,64px);gap:10px 20px}.key{width:64px;height:64px}
    }
    @media (max-height:620px) {
      .lock-screen{place-items:start center;overflow-y:auto;scrollbar-width:none}
      .lock-screen::-webkit-scrollbar{display:none}
      .lock-panel{padding:10px 24px 12px}.lock-icon{display:none}.lock-time{font-size:36px}
      .lock-date{margin:4px 0 10px;font-size:11px}.lock-title{margin-bottom:8px}
      .pass-dots{margin-bottom:10px}.keypad{grid-template-columns:repeat(3,48px);gap:5px 18px}
      .key{width:48px;height:48px;font-size:20px}.lock-message{margin-top:7px}
    }
    @media (prefers-reduced-motion:reduce) { .grain,.lock-screen::before,.scene-loader::after{animation:none} }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <section class="lock-screen" id="lockScreen" aria-labelledby="lockTitle">
    <div class="lock-panel">
      <div class="lock-icon" aria-hidden="true"></div>
      <p class="lock-time" id="lockTime">00:00</p>
      <p class="lock-date" id="lockDate"></p>
      <h2 class="lock-title" id="lockTitle">Nhập mật mã để bước vào</h2>
      <div class="pass-dots" id="passDots" aria-label="Chưa nhập số nào">
        <span class="pass-dot"></span><span class="pass-dot"></span>
        <span class="pass-dot"></span><span class="pass-dot"></span>
      </div>
      <div class="keypad" id="keypad">
        <button class="key" type="button" data-number="1">1<small>&nbsp;</small></button>
        <button class="key" type="button" data-number="2">2<small>ABC</small></button>
        <button class="key" type="button" data-number="3">3<small>DEF</small></button>
        <button class="key" type="button" data-number="4">4<small>GHI</small></button>
        <button class="key" type="button" data-number="5">5<small>JKL</small></button>
        <button class="key" type="button" data-number="6">6<small>MNO</small></button>
        <button class="key" type="button" data-number="7">7<small>PQRS</small></button>
        <button class="key" type="button" data-number="8">8<small>TUV</small></button>
        <button class="key" type="button" data-number="9">9<small>WXYZ</small></button>
        <span class="key empty" aria-hidden="true"></span>
        <button class="key" type="button" data-number="0">0<small>&nbsp;</small></button>
        <button class="key delete" id="deleteKey" type="button">Xóa</button>
      </div>
      <p class="lock-message" id="lockMessage" role="status">Mật mã chưa đúng. Hãy thử lại.</p>
    </div>
  </section>
  <canvas id="scene" aria-label="Nhân vật thiền định giữa tinh hà cùng hai chú cá voi 3D"></canvas>
  <div class="scene-loader" id="sceneLoader">Đang kiến tạo vũ trụ 3D</div>
  <div class="webgl-error" id="webglError">Thiết bị của bạn chưa hỗ trợ WebGL 2.<br>Hãy thử mở trang bằng trình duyệt mới hơn.</div>
  <div class="camera-hint">Kéo để xoay · Chạm để đổi góc nhìn</div>
  <div class="vignette"></div>
  <div class="grain"></div>

  <script>
    (() => {
      const screen=document.querySelector('#lockScreen');
      const dots=[...document.querySelectorAll('.pass-dot')];
      const dotRow=document.querySelector('#passDots');
      const message=document.querySelector('#lockMessage');
      const clockTime=document.querySelector('#lockTime');
      const clockDate=document.querySelector('#lockDate');
      let code='',checking=false,unlocked=false,clockTimer;
      const updateClock=()=>{
        const now=new Date();
        clockTime.textContent=now.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',hour12:false});
        clockDate.textContent=now.toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long'});
      };
      const renderCode=()=>{
        dots.forEach((dot,index)=>dot.classList.toggle('filled',index<code.length));
        dotRow.setAttribute('aria-label','Đã nhập '+code.length+' trên 4 số');
      };
      const unlock=()=>{
        unlocked=true;clearInterval(clockTimer);message.classList.remove('show');screen.classList.add('unlocked');
        if(document.activeElement instanceof HTMLElement)document.activeElement.blur();
        screen.setAttribute('aria-hidden','true');setTimeout(()=>screen.remove(),900);
      };
      const reject=()=>{
        message.classList.add('show');dotRow.classList.remove('error');void dotRow.offsetWidth;
        dotRow.classList.add('error');setTimeout(()=>{code='';checking=false;renderCode()},520);
      };
      const addNumber=number=>{
        if(checking||unlocked||code.length>=4)return;
        message.classList.remove('show');code+=number;renderCode();
        if(code.length===4){checking=true;setTimeout(()=>code==='0000'?unlock():reject(),170)}
      };
      document.querySelector('#keypad').addEventListener('click',event=>{
        const key=event.target.closest('[data-number]');if(key)addNumber(key.dataset.number);
      });
      document.querySelector('#deleteKey').addEventListener('click',()=>{
        if(checking||unlocked)return;code=code.slice(0,-1);message.classList.remove('show');renderCode();
      });
      addEventListener('keydown',event=>{
        if(unlocked||event.repeat)return;
        if(/^[0-9]$/.test(event.key))addNumber(event.key);
        if(event.key==='Backspace'&&!checking){code=code.slice(0,-1);renderCode()}
      });
      updateClock();clockTimer=setInterval(updateClock,30000);
    })();
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas=document.querySelector('#scene');
    const loader=document.querySelector('#sceneLoader');
    const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(!document.createElement('canvas').getContext('webgl2')){
      document.querySelector('#webglError').style.display='grid';
      loader.classList.add('hidden');
      throw new Error('WebGL 2 is not available');
    }

    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=.84;
    renderer.setClearColor(0x010208,1);
    const scene=new THREE.Scene();
    scene.background=new THREE.Color(0x010208);
    scene.fog=new THREE.FogExp2(0x02030d,.018);
    const camera=new THREE.PerspectiveCamera(49,1,.1,160);
    const world=new THREE.Group();
    scene.add(world);
    scene.add(new THREE.AmbientLight(0x34406f,.5));
    const coreLight=new THREE.PointLight(0xffc6f2,32,30,1.8);
    coreLight.position.set(0,.4,0);world.add(coreLight);
    const blueLight=new THREE.DirectionalLight(0x6ebcff,1.65);
    blueLight.position.set(-8,10,13);scene.add(blueLight);
    const violetLight=new THREE.DirectionalLight(0xb463ff,1.25);
    violetLight.position.set(9,-4,-10);scene.add(violetLight);

    const composer=new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene,camera));
    const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.72,.46,.34);
    composer.addPass(bloom);composer.addPass(new OutputPass());
    const controls=new OrbitControls(camera,canvas);
    controls.enableDamping=true;
    controls.dampingFactor=.055;
    controls.enablePan=false;
    controls.rotateSpeed=.52;
    controls.zoomSpeed=.72;
    controls.minPolarAngle=.24;
    controls.maxPolarAngle=Math.PI-.36;
    controls.target.set(0,0,0);
    let cameraInitialized=false;
    let cameraTransition=null;
    let viewIndex=0;

    function softTexture(stops){
      const size=256,c=document.createElement('canvas'),cctx=c.getContext('2d');
      c.width=c.height=size;
      const gradient=cctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
      stops.forEach(entry=>gradient.addColorStop(entry[0],entry[1]));
      cctx.fillStyle=gradient;cctx.fillRect(0,0,size,size);
      const texture=new THREE.CanvasTexture(c);texture.colorSpace=THREE.SRGBColorSpace;return texture;
    }

    function createCosmicWhaleTexture(){
      const c=document.createElement('canvas'),cctx=c.getContext('2d');
      c.width=1024;c.height=512;
      let seed=9173;
      const random=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
      const base=cctx.createLinearGradient(0,0,c.width,c.height);
      base.addColorStop(0,'#16065f');base.addColorStop(.27,'#4212a5');
      base.addColorStop(.52,'#861bd7');base.addColorStop(.73,'#1551dd');base.addColorStop(1,'#081563');
      cctx.fillStyle=base;cctx.fillRect(0,0,c.width,c.height);
      cctx.globalCompositeOperation='screen';
      for(let i=0;i<20;i++){
        const x=random()*c.width,y=random()*c.height,r=35+random()*75;
        const hue=random()>.48?'226,70,255':'0,178,255';
        const cloud=cctx.createRadialGradient(x,y,0,x,y,r);
        cloud.addColorStop(0,'rgba('+hue+','+(0.08+random()*.14)+')');
        cloud.addColorStop(.45,'rgba('+hue+',.045)');cloud.addColorStop(1,'rgba('+hue+',0)');
        cctx.fillStyle=cloud;cctx.fillRect(x-r,y-r,r*2,r*2);
      }
      const nebula=cctx.createLinearGradient(80,430,940,75);
      nebula.addColorStop(0,'rgba(255,42,230,0)');
      nebula.addColorStop(.3,'rgba(255,55,231,.25)');
      nebula.addColorStop(.52,'rgba(255,190,250,.34)');
      nebula.addColorStop(.68,'rgba(43,216,255,.28)');
      nebula.addColorStop(1,'rgba(19,88,255,0)');
      cctx.lineCap='round';
      [[28,40,438,295,338,665,218,986,72],[18,-30,315,260,430,700,205,1055,332],
        [12,70,188,320,88,670,372,1000,250],[9,10,390,300,280,720,430,1030,135],
        [7,120,74,390,245,650,110,960,205]].forEach((curve,index)=>{
        cctx.strokeStyle=index%2?nebula:'rgba(92,205,255,.22)';cctx.lineWidth=curve[0];
        cctx.beginPath();cctx.moveTo(curve[1],curve[2]);
        cctx.bezierCurveTo(curve[3],curve[4],curve[5],curve[6],curve[7],curve[8]);cctx.stroke();
      });
      for(let i=0;i<1400;i++){
        const x=random()*c.width,y=random()*c.height,r=.25+random()*.9;
        cctx.fillStyle=random()>.76?'rgba(104,220,255,.92)':'rgba(255,244,255,.9)';
        cctx.beginPath();cctx.arc(x,y,r,0,Math.PI*2);cctx.fill();
      }
      for(let i=0;i<82;i++){
        const x=random()*c.width,y=random()*c.height,r=1.15+random()*.9;
        cctx.fillStyle=random()>.68?'rgba(92,220,255,.94)':'rgba(255,236,255,.94)';
        cctx.beginPath();cctx.arc(x,y,r,0,Math.PI*2);cctx.fill();
      }
      for(let i=0;i<15;i++){
        const x=random()*c.width,y=random()*c.height,r=1.35+random()*1.45;
        cctx.strokeStyle='rgba(235,244,255,'+(0.55+random()*.38)+')';cctx.lineWidth=.8;
        cctx.beginPath();cctx.moveTo(x-r*4,y);cctx.lineTo(x+r*4,y);cctx.moveTo(x,y-r*4);cctx.lineTo(x,y+r*4);cctx.stroke();
        cctx.fillStyle='#ffffff';cctx.beginPath();cctx.arc(x,y,r,0,Math.PI*2);cctx.fill();
      }
      cctx.globalCompositeOperation='source-over';
      const texture=new THREE.CanvasTexture(c);
      texture.colorSpace=THREE.SRGBColorSpace;
      texture.wrapS=THREE.RepeatWrapping;
      texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
      const maskCanvas=document.createElement('canvas'),maskContext=maskCanvas.getContext('2d');
      maskCanvas.width=c.width;maskCanvas.height=c.height;
      const source=cctx.getImageData(0,0,c.width,c.height);
      const mask=maskContext.createImageData(c.width,c.height);
      for(let i=0;i<source.data.length;i+=4){
        const r=source.data[i]/255,g=source.data[i+1]/255,b=source.data[i+2]/255;
        const luminance=r*.2126+g*.7152+b*.0722;
        const whiteness=Math.min(r,g,b);
        const value=Math.min(1,Math.max(0,(luminance-.67)/.33, (whiteness-.62)/.38));
        mask.data[i]=mask.data[i+1]=mask.data[i+2]=Math.round(value*255);mask.data[i+3]=255;
      }
      maskContext.putImageData(mask,0,0);
      const emissive=new THREE.CanvasTexture(maskCanvas);
      emissive.colorSpace=THREE.SRGBColorSpace;emissive.wrapS=THREE.RepeatWrapping;
      emissive.anisotropy=texture.anisotropy;
      return {color:texture,emissive};
    }

    const cosmicWhaleTextures=createCosmicWhaleTexture();

    function createStarfield(){
      const count=innerWidth<620?1800:3600;
      const positions=new Float32Array(count*3),colors=new Float32Array(count*3),color=new THREE.Color();
      for(let i=0;i<count;i++){
        const radius=THREE.MathUtils.randFloat(38,105),theta=Math.random()*Math.PI*2;
        const phi=Math.acos(THREE.MathUtils.randFloatSpread(2));
        positions[i*3]=radius*Math.sin(phi)*Math.cos(theta);
        positions[i*3+1]=radius*Math.cos(phi);
        positions[i*3+2]=radius*Math.sin(phi)*Math.sin(theta);
        color.setHSL(THREE.MathUtils.randFloat(.56,.75),THREE.MathUtils.randFloat(.35,.88),THREE.MathUtils.randFloat(.62,1));
        colors.set([color.r,color.g,color.b],i*3);
      }
      const geometry=new THREE.BufferGeometry();
      geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));
      geometry.setAttribute('color',new THREE.BufferAttribute(colors,3));
      const material=new THREE.PointsMaterial({size:.085,vertexColors:true,transparent:true,opacity:.78,sizeAttenuation:true,depthWrite:false});
      scene.add(new THREE.Points(geometry,material));
    }

    const galaxyVertex=[
      'attribute float aSize;',
      'attribute float aSeed;',
      'varying vec3 vColor;',
      'varying float vPulse;',
      'uniform float uTime;',
      'uniform float uPixelRatio;',
      'void main(){',
      'vColor=color;',
      'vPulse=.74+.26*sin(uTime*(.7+aSeed*.8)+aSeed*19.0);',
      'vec3 p=position;',
      'p.y+=sin(uTime*.12+aSeed*31.0)*.018;',
      'vec4 mvPosition=modelViewMatrix*vec4(p,1.0);',
      'gl_PointSize=aSize*uPixelRatio*(54.0/max(2.0,-mvPosition.z));',
      'gl_Position=projectionMatrix*mvPosition;',
      '}'
    ].join('\n');
    const galaxyFragment=[
      'varying vec3 vColor;',
      'varying float vPulse;',
      'void main(){',
      'float d=distance(gl_PointCoord,vec2(.5));',
      'float alpha=(1.0-smoothstep(.04,.5,d))*vPulse;',
      'float core=1.0-smoothstep(0.0,.18,d);',
      'gl_FragColor=vec4(vColor+core*.5,alpha);',
      '}'
    ].join('\n');

    function createGalaxy(){

      const color=new THREE.Color(),branches=5,maxRadius=6.8;
      for(let i=0;i<count;i++){
        const radius=Math.pow(Math.random(),.57)*maxRadius;
        const branch=(i%branches)/branches*Math.PI*2;
        const spin=radius*.79;
        const spread=Math.pow(Math.random(),2.7)*(Math.random()<.5?-1:1);
        const angle=branch+spin+spread*(.58+radius*.075);
        const thickness=(Math.random()-.5)*(.66*Math.pow(1-radius/maxRadius,1.7)+.07);
        positions[i*3]=Math.cos(angle)*radius+THREE.MathUtils.randFloatSpread(.11);
        positions[i*3+1]=thickness;
        positions[i*3+2]=Math.sin(angle)*radius+THREE.MathUtils.randFloatSpread(.11);
        if(radius<2.1)color.copy(inner).lerp(middle,radius/2.1);
        else color.copy(middle).lerp(outer,(radius-2.1)/(maxRadius-2.1));
        const brightness=THREE.MathUtils.randFloat(.48,.98);
        colors[i*3]=color.r*brightness;colors[i*3+1]=color.g*brightness;colors[i*3+2]=color.b*brightness;
        sizes[i]=THREE.MathUtils.randFloat(.52,1.85)*(1.25-radius/maxRadius*.35);seeds[i]=Math.random();
      }
      const geometry=new THREE.BufferGeometry();

      geometry.setAttribute('color',new THREE.BufferAttribute(colors,3));
      geometry.setAttribute('aSize',new THREE.BufferAttribute(sizes,1));
      geometry.setAttribute('aSeed',new THREE.BufferAttribute(seeds,1));
      const uniforms={uTime:{value:0},uPixelRatio:{value:1}};
      const material=new THREE.ShaderMaterial({uniforms,vertexShader:galaxyVertex,fragmentShader:galaxyFragment,transparent:true,vertexColors:true,blending:THREE.AdditiveBlending,depthWrite:false});

      const haloSizes=new Float32Array(haloCount),haloSeeds=new Float32Array(haloCount);
      const haloPurple=new THREE.Color(0xc150ff),haloBlue=new THREE.Color(0x48a7ff),haloColor=new THREE.Color();
      for(let i=0;i<haloCount;i++){

      precision highp float;

      attribute float aAlpha;
      varying vec3 vColor;
      varying float vAlpha;
      uniform float uTime;
      uniform float uPixelRatio;
      uniform float uMotionScale;
      uniform float uReveal;

      void main(){
        vColor=color;
        float animatedTwinkle=.68+.32*sin(uTime*(.46+aSeed*.22)+aSeed*31.0);
        float twinkle=mix(.9,animatedTwinkle,uMotionScale);
        vAlpha=aAlpha*twinkle*uReveal;

        p.y+=sin(uTime*(.14+aSeed*.05)+aSeed*26.0)*(.016+aSeed*.022)*uMotionScale;

        gl_Position=projectionMatrix*mvPosition;
      }
    `;

        float halo=1.0-smoothstep(.08,.5,d);
        float core=1.0-smoothstep(0.0,.14,d);

      }
    `;

    function createWhaleGeometry(){
      const sides=32;
      const profile=[
        [-4.5,.08,.06,.06,.07],[-4.42,.08,.11,.1,.13],[-4.1,.06,.21,.19,.26],
        [-3.65,.03,.34,.31,.4],[-3.1,.01,.46,.4,.52],[-2.45,0,.66,.55,.75],
        [-1.55,0,.84,.69,.99],[-.55,.02,.95,.77,1.16],[.45,.05,1,.84,1.24],
        [1.35,.07,.95,.88,1.25],[2.1,.07,.82,.84,1.19],[2.7,.07,.72,.78,1.14],
        [3.15,.07,.63,.7,1.08],[3.52,.06,.56,.64,1],[3.82,.04,.5,.59,.91],
        [4.06,.01,.44,.53,.81],[4.24,-.02,.36,.45,.67],[4.36,-.04,.25,.32,.48],
        [4.43,-.05,.12,.16,.25],[4.47,-.05,.018,.024,.04]
      ];
      const sample=(x,column)=>{
        if(x<=profile[0][0])return profile[0][column];
        for(let i=1;i<profile.length;i++)if(x<=profile[i][0]){
          const previous=profile[i-1],next=profile[i];
          const raw=THREE.MathUtils.clamp((x-previous[0])/(next[0]-previous[0]),0,1);
          const t=raw*raw*(3-2*raw);
          return THREE.MathUtils.lerp(previous[column],next[column],t);
        }
        return profile[profile.length-1][column];
      };
      const tailX=profile[0][0],headX=profile[profile.length-1][0];
      const boneXs=[3.05,1.55,.2,-1.05,-2.1,-3.05,-3.82,-4.28];
      const boneYs=boneXs.map(x=>sample(x,1));
      const addSkin=(x,indices,weights)=>{
        if(x>=boneXs[0]){indices.push(0,0,0,0);weights.push(1,0,0,0);return}
        const last=boneXs.length-1;
        if(x<=boneXs[last]){indices.push(last,last,0,0);weights.push(1,0,0,0);return}
        for(let i=0;i<last;i++)if(x<=boneXs[i]&&x>=boneXs[i+1]){
          const mix=(boneXs[i]-x)/(boneXs[i]-boneXs[i+1]);
          indices.push(i,i+1,0,0);weights.push(1-mix,mix,0,0);return;
        }
      };
      const pointAt=(x,angle,outward=1)=>{
        const cosine=Math.cos(angle),sine=Math.sin(angle);
        const exponent=2/THREE.MathUtils.lerp(2,2.62,THREE.MathUtils.smoothstep(x,2.05,4.18));
        const yAxis=cosine>=0?sample(x,2):sample(x,3);
        const y=Math.sign(cosine)*yAxis*Math.pow(Math.abs(cosine),exponent)*outward;
        const z=Math.sign(sine)*sample(x,4)*Math.pow(Math.abs(sine),exponent)*outward;
        return [x,sample(x,1)+y,z];
      };

      const positions=[],uvs=[],indices=[],skinIndices=[],skinWeights=[];
      const ringXs=[tailX];
      for(let i=1;i<profile.length;i++){
        const start=profile[i-1][0],end=profile[i][0];
        const divisions=Math.max(1,Math.ceil((end-start)/.105));
        for(let step=1;step<=divisions;step++)ringXs.push(THREE.MathUtils.lerp(start,end,step/divisions));
      }
      for(let i=0;i<ringXs.length;i++){
        const x=ringXs[i],u=(x-tailX)/(headX-tailX);
        for(let j=0;j<=sides;j++){
          const v=j/sides,point=pointAt(x,v*Math.PI*2);
          positions.push(...point);uvs.push(u,v);addSkin(x,skinIndices,skinWeights);
        }
      }
      for(let i=0;i<ringXs.length-1;i++)for(let j=0;j<sides;j++){
        const a=i*(sides+1)+j,b=a+sides+1;indices.push(a,a+1,b,b,a+1,b+1);
      }
      const geometry=new THREE.BufferGeometry();
      geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
      geometry.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
      geometry.setAttribute('skinIndex',new THREE.Uint16BufferAttribute(skinIndices,4));
      geometry.setAttribute('skinWeight',new THREE.Float32BufferAttribute(skinWeights,4));
      geometry.setIndex(indices);geometry.computeVertexNormals();

      const bellyRings=52,bellySides=14,bellyPositions=[],bellyUvs=[],bellyIndices=[];
      const bellySkinIndices=[],bellySkinWeights=[];
      for(let i=0;i<=bellyRings;i++){
        const patchU=i/bellyRings,x=THREE.MathUtils.lerp(-1.65,4.43,patchU);
        const u=(x-tailX)/(headX-tailX);
        const fullOpening=THREE.MathUtils.lerp(.5,.57,THREE.MathUtils.smoothstep(x,.6,2.7));
        const opening=THREE.MathUtils.lerp(.035,fullOpening,THREE.MathUtils.smoothstep(patchU,.01,.16));
        for(let j=0;j<=bellySides;j++){
          const patchV=j/bellySides;
          const angle=Math.PI+(patchV-.5)*opening*Math.PI*2;
          const point=pointAt(x,angle,1.018);
          bellyPositions.push(...point);bellyUvs.push(u,patchV);addSkin(x,bellySkinIndices,bellySkinWeights);
        }
      }
      for(let i=0;i<bellyRings;i++)for(let j=0;j<bellySides;j++){
        const a=i*(bellySides+1)+j,b=a+bellySides+1;
        bellyIndices.push(a,a+1,b,b,a+1,b+1);
      }
      const bellyGeometry=new THREE.BufferGeometry();
      bellyGeometry.setAttribute('position',new THREE.Float32BufferAttribute(bellyPositions,3));
      bellyGeometry.setAttribute('uv',new THREE.Float32BufferAttribute(bellyUvs,2));
      bellyGeometry.setAttribute('skinIndex',new THREE.Uint16BufferAttribute(bellySkinIndices,4));
      bellyGeometry.setAttribute('skinWeight',new THREE.Float32BufferAttribute(bellySkinWeights,4));
      bellyGeometry.setIndex(bellyIndices);bellyGeometry.computeVertexNormals();
      return {geometry,bellyGeometry,boneXs,boneYs};
    }

      const bodyMaterial=new THREE.MeshPhysicalMaterial({
        color:0xffffff,map:cosmicWhaleTextures.color,roughness:.24,metalness:.03,clearcoat:.72,clearcoatRoughness:.18,

      }
      const skeleton=new THREE.Skeleton(bones);
      const body=new THREE.SkinnedMesh(geometry,bodyMaterial);
      body.add(bones[0]);body.bind(skeleton);body.normalizeSkinWeights();body.frustumCulled=false;root.add(body);
      const bellyMaterial=new THREE.MeshPhysicalMaterial({
        color:0xd6d9ff,roughness:.36,metalness:0,clearcoat:.36,clearcoatRoughness:.38,
        emissive:0x46416f,emissiveIntensity:.18,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1
      });
      const bellyMesh=new THREE.SkinnedMesh(bellyGeometry,bellyMaterial);
      bellyMesh.bind(skeleton,body.bindMatrix);bellyMesh.normalizeSkinWeights();bellyMesh.frustumCulled=false;root.add(bellyMesh);
      const eyeMaterial=new THREE.MeshPhysicalMaterial({color:0x010107,roughness:.08,clearcoat:1});
      const eyeSocketMaterial=new THREE.MeshPhysicalMaterial({color:0x14063e,roughness:.3,clearcoat:.55});
      const eyeGlowMaterial=new THREE.MeshBasicMaterial({color:0xaee9ff});
      [-1,1].forEach(side=>{
        const eyeSocket=new THREE.Mesh(new THREE.SphereGeometry(.105,16,10),eyeSocketMaterial);
        eyeSocket.scale.set(1.35,.68,.36);eyeSocket.position.set(.22,.06,side*1.187);bones[1].add(eyeSocket);
        const eye=new THREE.Mesh(new THREE.SphereGeometry(.064,16,12),eyeMaterial);
        eye.scale.y=.72;eye.position.set(.22,.06,side*1.205);bones[1].add(eye);
        const eyeGlow=new THREE.Mesh(new THREE.SphereGeometry(.012,8,6),eyeGlowMaterial);
        eyeGlow.position.set(.035,.025,side*.047);eye.add(eyeGlow);
        const mouthCurve=new THREE.CatmullRomCurve3([
          new THREE.Vector3(-1.25,-.18,side*1.2),
          new THREE.Vector3(-.65,-.28,side*1.15),
          new THREE.Vector3(.05,-.32,side*1.05),
          new THREE.Vector3(.7,-.26,side*.87),
          new THREE.Vector3(1.17,-.17,side*.63),
          new THREE.Vector3(1.38,-.08,side*.23)
        ]);
        const mouth=new THREE.Mesh(
          new THREE.TubeGeometry(mouthCurve,26,.017,6,false),
          new THREE.MeshBasicMaterial({color:0x140627})
        );
        bones[0].add(mouth);
      });
      const bumpMaterial=new THREE.MeshPhysicalMaterial({color:0x925ee8,roughness:.38,emissive:0x56219d,emissiveIntensity:.28});
      [[-.95,.84,0],[-.62,.785,.25],[-.62,.785,-.25],[-.18,.67,.42],[-.18,.67,-.42],
        [.3,.59,.36],[.3,.59,-.36],[.76,.47,.22],[.76,.47,-.22],[1.04,.35,0],[1.28,.18,0]].forEach((point,index)=>{
        const bump=new THREE.Mesh(new THREE.SphereGeometry(.028+(index%4)*.0025,9,7),bumpMaterial);
        bump.position.set(point[0],point[1],point[2]);bones[0].add(bump);
      });
      const blowholeMaterial=new THREE.MeshPhysicalMaterial({color:0x080214,roughness:.18,clearcoat:.7});
      [-.085,.085].forEach(z=>{
        const blowhole=new THREE.Mesh(new THREE.SphereGeometry(.055,12,8),blowholeMaterial);
        blowhole.scale.set(1.3,.22,.58);blowhole.position.set(-.55,.82,z);bones[0].add(blowhole);
      });
      const finMaterial=new THREE.MeshPhysicalMaterial({
        color:0xe9e2ff,map:cosmicWhaleTextures.color,emissive:0x7440df,emissiveMap:cosmicWhaleTextures.emissive,
        emissiveIntensity:.48,roughness:.22,clearcoat:.68,clearcoatRoughness:.16,
        iridescence:.55,iridescenceIOR:1.38
      });
      const pectoralGeometry=createAppendageGeometry(false),flukeGeometry=createAppendageGeometry(true);
      const fins=[];
      [-1,1].forEach(side=>{
        const pivot=new THREE.Group();pivot.position.set(-.12,-.25,side*1.15);pivot.userData.side=side;
        const fin=new THREE.Mesh(pectoralGeometry,finMaterial);fin.scale.set(1.12,1.08,side*.9);pivot.add(fin);
        bones[1].add(pivot);fins.push(pivot);
      });
      const flukeRoot=new THREE.Group();
      flukeRoot.position.set(-.14,.02,0);bones[bones.length-1].add(flukeRoot);
      [-1,1].forEach(side=>{
        const lobePivot=new THREE.Group();lobePivot.rotation.x=side*.035;
        const fluke=new THREE.Mesh(flukeGeometry,finMaterial);fluke.scale.z=side;lobePivot.add(fluke);
        flukeRoot.add(lobePivot);
      });
      const dorsal=new THREE.Mesh(createDorsalGeometry(),finMaterial);
      dorsal.position.set(.35,.84,0);bones[4].add(dorsal);

      const grooveMaterial=new THREE.MeshBasicMaterial({color:0x77759f,transparent:true,opacity:.62});
      [-.42,-.21,0,.21,.42].forEach(z=>{
        const grooveCurve=new THREE.CatmullRomCurve3([
          new THREE.Vector3(-.2,-.7,z*.76),
          new THREE.Vector3(.45,-.82,z),
          new THREE.Vector3(1.2,-.72,z*.82),
          new THREE.Vector3(1.72,-.48,z*.5)
        ]);
        bones[1].add(new THREE.Mesh(new THREE.TubeGeometry(grooveCurve,18,.011,5,false),grooveMaterial));
      });
      world.add(root);return {root,bones,fins,flukeRoot,bellyMesh,waveProfile,motion,offset,speed,pathScale,swimOffset:offset*Math.PI*2};
    }

    const pathPoints=[];
    for(let i=0;i<12;i++){
      const angle=i/12*Math.PI*2;
      const height=-Math.sin(angle+.4)*.9+Math.sin(angle*3-.2)*.22;
      pathPoints.push(new THREE.Vector3(Math.cos(angle)*9.2,height,Math.sin(angle)*7.7));
    }
    const swimPath=new THREE.CatmullRomCurve3(pathPoints,true,'centripetal',.45);
    const whales=[
      createWhale({scale:.72,offset:.22,hueOffset:0,pathScale:1}),
      createWhale({scale:.49,offset:.72,hueOffset:.06,pathScale:1})
    ];
    const axisX=new THREE.Vector3(1,0,0),axisZ=new THREE.Vector3(0,0,1);
    const tangent=new THREE.Vector3(),tangentAhead=new THREE.Vector3(),position=new THREE.Vector3();
    const worldUp=new THREE.Vector3(0,1,0),pathUp=new THREE.Vector3(),pathSide=new THREE.Vector3();
    const turnCross=new THREE.Vector3();
    const orientationMatrix=new THREE.Matrix4();
    const targetQuaternion=new THREE.Quaternion(),rollQuaternion=new THREE.Quaternion(),pitchQuaternion=new THREE.Quaternion();

    function whaleWave(phase){
      return Math.sin(phase)+.035*Math.sin(phase*2+.4)+.008*Math.sin(phase*3-.35);
    }

    function animateWhale(whale,time,delta){
      const cycle=(time*whale.speed+whale.offset)%1;
      const motion=whale.motion;
      const swimRate=Math.PI*2*motion.tailBeatFrequency;
      const stroke=time*swimRate+whale.swimOffset;
      swimPath.getPointAt(cycle,position);swimPath.getTangentAt(cycle,tangent).normalize();
      swimPath.getTangentAt((cycle+.004)%1,tangentAhead).normalize();
      whale.root.position.copy(position).multiplyScalar(whale.pathScale);
      pathSide.crossVectors(tangent,worldUp);
      if(pathSide.lengthSq()<.000001)pathSide.set(0,0,1);else pathSide.normalize();
      pathUp.crossVectors(pathSide,tangent).normalize();
      orientationMatrix.makeBasis(tangent,pathUp,pathSide);
      targetQuaternion.setFromRotationMatrix(orientationMatrix);
      turnCross.crossVectors(tangent,tangentAhead);
      const curvatureBank=THREE.MathUtils.clamp(worldUp.dot(turnCross)*9,-.24,.24);
      const livingRoll=Math.sin(time*.36+whale.swimOffset)*.025;
      const livingPitch=whaleWave(stroke-.85)*motion.pitchAmplitude;
      rollQuaternion.setFromAxisAngle(axisX,curvatureBank+livingRoll);
      pitchQuaternion.setFromAxisAngle(axisZ,livingPitch);
      targetQuaternion.multiply(rollQuaternion).multiply(pitchQuaternion);
      whale.root.quaternion.slerp(targetQuaternion,1-Math.exp(-motion.orientationResponse*delta));
      let previousTangent=0;
      whale.bones.forEach((bone,index)=>{
        const profile=whale.waveProfile[index];
        const phase=stroke-profile.s*motion.phaseDelay;
        const desiredTangent=whaleWave(phase)*profile.amplitude;
        bone.rotation.z=desiredTangent-previousTangent;
        bone.rotation.x=0;bone.rotation.y=0;
        previousTangent=desiredTangent;
      });
      whale.fins.forEach(fin=>{
        const side=fin.userData.side;
        const finPhase=stroke*motion.pectoralRate-.65;
        fin.rotation.x=side*(.24+motion.pectoralAmplitude*Math.sin(finPhase))-curvatureBank*motion.finSteering;
        fin.rotation.y=.075+motion.pectoralTiltAmplitude*Math.sin(stroke*.22+1.1);
        fin.rotation.z=-side*(.03+motion.pectoralTiltAmplitude*.75*Math.sin(finPhase+.55));
      });
      const tailPhase=stroke-motion.phaseDelay-motion.flukeLag;
      whale.flukeRoot.rotation.z=-motion.tailAmplitude*whaleWave(tailPhase);
      const heave=(Math.sin(stroke-.72)*motion.heaveAmplitude+Math.sin(stroke*2+.1)*motion.heaveHarmonic)*whale.root.scale.x;
      whale.root.position.addScaledVector(pathUp,heave);
    }

    createStarfield();
    const galaxy=createGalaxy();
    const meditatingCharacter=createMeditatingCharacter();
    const dustTexture=softTexture([[0,'rgba(148,106,255,.32)'],[.35,'rgba(68,73,220,.12)'],[1,'rgba(20,16,80,0)']]);
    for(let i=0;i<13;i++){
      const cloud=new THREE.Sprite(new THREE.SpriteMaterial({map:dustTexture,color:i%2?0x875dff:0x387fcf,transparent:true,opacity:THREE.MathUtils.randFloat(.045,.105),blending:THREE.AdditiveBlending,depthWrite:false}));
      const angle=Math.random()*Math.PI*2,r=THREE.MathUtils.randFloat(3.5,10);
      cloud.position.set(Math.cos(angle)*r,THREE.MathUtils.randFloatSpread(3),Math.sin(angle)*r);
      const size=THREE.MathUtils.randFloat(4,8);cloud.scale.set(size,size,1);world.add(cloud);
    }

    const timer=new THREE.Timer();
    timer.connect(document);
    function cameraViews(){
      if(innerWidth<620)return [
        new THREE.Vector3(0,4.3,20.5),
        new THREE.Vector3(8.8,6.4,16.2),
        new THREE.Vector3(-8.2,3.2,17.4),
        new THREE.Vector3(0,12.5,14.2)
      ];
      return [
        new THREE.Vector3(0,5.1,21.5),
        new THREE.Vector3(15.2,7.1,13.1),
        new THREE.Vector3(-13.6,3.4,15.3),
        new THREE.Vector3(0,15.2,11.8)
      ];
    }
    function cycleCameraView(){
      const views=cameraViews();
      viewIndex=(viewIndex+1)%views.length;
      cameraTransition={position:views[viewIndex],target:new THREE.Vector3(0,0,0)};
    }
    function resize(){
      const w=innerWidth,h=innerHeight,aspect=w/h,mobile=w<620;
      const pixelRatio=Math.min(devicePixelRatio||1,mobile?1.2:1.45);
      renderer.setPixelRatio(pixelRatio);renderer.setSize(w,h,false);
      composer.setPixelRatio(pixelRatio);composer.setSize(w,h);
      camera.aspect=aspect;camera.fov=mobile?56:49;
      if(!cameraInitialized){
        camera.position.copy(cameraViews()[0]);
        cameraInitialized=true;
      }
      world.scale.setScalar(mobile?.72:1);camera.updateProjectionMatrix();
      controls.minDistance=mobile?10:11;
      controls.maxDistance=mobile?31:38;
      bloom.strength=mobile?.56:.72;galaxy.userData.uniforms.uPixelRatio.value=pixelRatio;
      meditatingCharacter.setResponsive(mobile,pixelRatio);
    }
    function render(timestamp){
      timer.update(timestamp);
      const delta=Math.min(timer.getDelta(),.05);
      const time=timer.getElapsed()*(reducedMotion?.16:1);
      galaxy.rotation.y=time*.028;galaxy.rotation.x=Math.sin(time*.045)*.025;
      galaxy.userData.uniforms.uTime.value=time;whales.forEach(whale=>animateWhale(whale,time,delta));
      if(cameraTransition){
        camera.position.lerp(cameraTransition.position,1-Math.exp(-2.76*delta));
        controls.target.lerp(cameraTransition.target,1-Math.exp(-3.4*delta));
        if(camera.position.distanceTo(cameraTransition.position)<.035)cameraTransition=null;
      }
      controls.update();
      meditatingCharacter.update(time,delta,camera,reducedMotion);
      composer.render();requestAnimationFrame(render);
    }
    let gestureStart=null;
    canvas.addEventListener('pointerdown',event=>{
      if(!event.isPrimary){gestureStart=null;return}
      cameraTransition=null;
      gestureStart={x:event.clientX,y:event.clientY,time:performance.now()};
      document.body.classList.add('camera-used');
    },{passive:true});
    canvas.addEventListener('pointerup',event=>{
      if(!event.isPrimary){gestureStart=null;return}
      if(!gestureStart)return;
      const distance=Math.hypot(event.clientX-gestureStart.x,event.clientY-gestureStart.y);
      const duration=performance.now()-gestureStart.time;
      if(distance<8&&duration<480)cycleCameraView();
      gestureStart=null;
    },{passive:true});
    canvas.addEventListener('pointercancel',()=>{gestureStart=null},{passive:true});
    controls.addEventListener('start',()=>{cameraTransition=null});
    addEventListener('resize',resize,{passive:true});
    addEventListener('beforeunload',()=>meditatingCharacter.dispose(),{once:true});
    resize();canvas.classList.add('ready');loader.classList.add('hidden');requestAnimationFrame(render);
  </script>
</body>
</html>
